# Prometheus alerting rules for Lurus Hub Phase 1 hardening.
#
# Mount path examples:
#   - kube-prometheus-stack: kind: PrometheusRule, namespace: monitoring
#   - bare prometheus: rule_files: [newhub-alerts.yaml] in prometheus.yml
#
# Severity convention:
#   page    — wakes on-call (5xx burst, breaker stuck open, settlement broken)
#   ticket  — file an issue, look at it next business hour
#   info    — anomaly, FYI in chat
#
# Metric naming (DO NOT drift):
#   gateway metrics — internal/pkg/metrics/metrics.go → "lurus_gateway_*"
#                     (namespace="lurus", subsystem="gateway")
#   billing metrics — internal/pkg/metrics/billing.go → "lurus_billing_*"
#                     (namespace="lurus", subsystem="billing")
#   If the Go subsystem strings ever change, search-replace here too.
#   (2026-05-18 incident: all 11 rules silently dead for months because
#    YAML used "lurus_hub_*" while Go emitted "lurus_gateway_*".)

groups:
  - name: lurus-hub-availability
    interval: 30s
    rules:
      - alert: HubAvailabilityBelowSLO
        expr: |
          (
            1 - sum(rate(lurus_gateway_requests_total{status=~"5.."}[5m]))
              / sum(rate(lurus_gateway_requests_total[5m]))
          ) * 100 < 99.5
        for: 10m
        labels:
          severity: page
          service: lurus-hub
        annotations:
          summary: "newhub availability {{ printf \"%.3f\" $value }}% < 99.5% SLO"
          description: "5xx rate exceeded budget for 10m. Check upstream provider health and circuit breaker dashboard."

      - alert: HubAvailabilityCritical
        expr: |
          (
            1 - sum(rate(lurus_gateway_requests_total{status=~"5.."}[5m]))
              / sum(rate(lurus_gateway_requests_total[5m]))
          ) * 100 < 95
        for: 2m
        labels:
          severity: page
          service: lurus-hub
        annotations:
          summary: "newhub availability {{ printf \"%.2f\" $value }}% < 95% — major outage"

  - name: lurus-hub-latency
    interval: 30s
    rules:
      - alert: HubP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(lurus_gateway_request_duration_seconds_bucket[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "p95 latency {{ printf \"%.2f\" $value }}s > 3s"
          description: "Sustained slow requests; check upstream timeouts and channel selection."

      - alert: HubGatewayOverheadHigh
        expr: |
          (
            histogram_quantile(0.95, sum(rate(lurus_gateway_request_duration_seconds_bucket[5m])) by (le))
            -
            histogram_quantile(0.95, sum(rate(lurus_gateway_relay_duration_seconds_bucket[5m])) by (le))
          ) > 0.1
        for: 15m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "gateway overhead {{ printf \"%.0f\" ($value*1000) }}ms > 100ms"
          description: "newhub itself is adding >100ms on top of the upstream — north-star target is <50ms. Check billing pre-auth and NATS publish latency."

  - name: lurus-hub-circuit-breaker
    interval: 30s
    rules:
      - alert: ChannelBreakerStuckOpen
        expr: lurus_gateway_circuit_breaker_state == 1
        for: 30m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "channel {{ $labels.channel_id }} breaker open for 30m+"
          description: "Channel hasn't recovered. Confirm upstream provider is healthy or disable the channel manually."

      - alert: ChannelBreakerFlapping
        expr: |
          changes(lurus_gateway_circuit_breaker_state[10m]) > 5
        for: 5m
        labels:
          severity: info
          service: lurus-hub
        annotations:
          summary: "channel {{ $labels.channel_id }} breaker flapping (>5 changes/10m)"
          description: "Indicates marginal upstream health. Consider raising the breaker threshold or removing the channel."

  - name: lurus-hub-quota-spikes
    interval: 30s
    rules:
      - alert: CostSpikeBurstHigh
        expr: sum(rate(lurus_gateway_requests_total{status="429"}[5m])) > 1
        for: 5m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "cost-spike 429s firing at {{ printf \"%.2f\" $value }}/s"
          description: "This expr counts EVERY 429 the gateway emits, not just cost-spike ones — the other producers are the per-token/per-model rate limits, the concurrency limit, the entitlement gate, secure-verification and TOTP, plus upstream 429s passed through by the relay. So a firing alert most likely means a rate-limit surge; treat it as such first. The cost-spike fuse can only contribute here when COST_SPIKE_ENFORCE=true, which is NOT the shipped default (see internal/pkg/common/constants.go) — under the default observe mode a cost-spike breach is counted, not blocked, so watch CostSpikeObservedRateHigh below for that signal instead."

      # Observe-mode counterpart to CostSpikeBurstHigh: COST_SPIKE_ENFORCE
      # defaults to false (internal/pkg/common/constants.go), so
      # breaches are counted via lurus_gateway_cost_spike_breach_total but
      # never 429 and CostSpikeBurstHigh above stays silent. Info severity,
      # not paged — the actual consumer for "observe first, collect the real
      # distribution" before enforce is flipped back on.
      - alert: CostSpikeObservedRateHigh
        expr: sum(rate(lurus_gateway_cost_spike_breach_total{action="observed"}[5m])) > 0.02
        for: 10m
        labels:
          severity: info
          service: lurus-hub
        annotations:
          summary: "cost-spike observed-mode breaches at {{ printf \"%.3f\" $value }}/s"
          description: "COST_SPIKE_ENFORCE=false (observe mode): breaches are counted/logged but admitted, never blocked. Informational only — use this to gauge whether the threshold or enforce rollout needs revisiting."

      - alert: QuotaCapBurstHigh
        expr: sum(rate(lurus_gateway_requests_total{status="402"}[5m])) > 5
        for: 10m
        labels:
          severity: info
          service: lurus-hub
        annotations:
          summary: "402 quota-capped at {{ printf \"%.1f\" $value }}/s"
          description: "Many users hitting MaxQuota. Likely a billing day and clients should respect Retry-After. Investigate if accelerating."

  - name: lurus-hub-billing
    interval: 60s
    rules:
      - alert: PlatformBreakerOpen
        expr: lurus_billing_circuit_breaker_state == 1
        for: 5m
        labels:
          severity: page
          service: lurus-hub
        annotations:
          summary: "lurus-platform breaker open — settlement halted"
          description: "newhub stopped settling pre-auths to platform. Quota is being consumed but wallet not debited. Check platform health."

      - alert: BillingOutboxBacklog
        expr: lurus_billing_outbox_pending > 100
        for: 15m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "billing outbox depth {{ $value }} > 100"
          description: "Settlement-retry queue is growing. Either platform is slow or a bug is preventing dequeue."

      - alert: BillingOutboxFailures
        expr: rate(lurus_billing_outbox_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: ticket
          service: lurus-hub
        annotations:
          summary: "{{ $value }} pre-auths permanently failed (max retries exceeded)"
          description: "Manual reconciliation needed. See billing runbook."

      # ----------------------------------------------------------------
      # Tenant credit pool (ADR 2026-05-18). Fires when a pool drops
      # below 1000 quota units of remaining balance for 10m — Reseller
      # should topup before downstream traffic hits HTTP 402.
      # ----------------------------------------------------------------
      - alert: CreditPoolBalanceLow
        expr: lurus_gateway_credit_pool_balance < 1000 and lurus_gateway_credit_pool_balance > 0
        for: 10m
        labels:
          severity: warning
          service: lurus-hub
          component: tenant_credit_pool
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} credit pool balance {{ $value }} below threshold"
          description: "Pool has been below 1000 quota units for 10m. Notify Reseller for topup; see doc/runbook/pool-threshold-alert.md"

      - alert: CreditPoolExhausted
        expr: lurus_gateway_credit_pool_balance <= 0
        for: 5m
        labels:
          severity: page
          service: lurus-hub
          component: tenant_credit_pool
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} credit pool EXHAUSTED — relay returning HTTP 402"
          description: "All relay calls for this tenant are now 402-blocked. Page Reseller for topup or escalate per runbook."

  # P0-4: Google SRE multi-window multi-burn-rate alerts on the relay SLOs in
  # doc/slo-relay.md. Mirrors deploy/k8s/r6-stage/newhub-prometheus-rule.yaml —
  # keep the two in sync. Availability SLO 99.5% (0.5% budget): fast 14.4× burn
  # (2% budget/1h, 1h∧5m), slow 6× burn (5% budget/6h, 6h∧30m). Overhead SLO 99%
  # under 50ms (1% budget): fast 14.4× burn. Threshold: bad_rate > burn × (1−SLO).
  - name: lurus-hub-slo-burn-rate
    interval: 30s
    rules:
      - alert: RelayAvailabilityFastBurn
        expr: |
          (
            sum(rate(lurus_gateway_relay_total_duration_seconds_count{status!="success"}[1h]))
              / sum(rate(lurus_gateway_relay_total_duration_seconds_count[1h]))
          ) > (14.4 * 0.005)
          and
          (
            sum(rate(lurus_gateway_relay_total_duration_seconds_count{status!="success"}[5m]))
              / sum(rate(lurus_gateway_relay_total_duration_seconds_count[5m]))
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
          service: lurus-hub
          slo: relay-availability
        annotations:
          summary: "relay availability fast-burn — 2% of 30d error budget in <1h"
          description: "Relay error ratio >7.2% over both 1h and 5m. Check upstream providers + circuit breakers; runbook doc/slo-relay.md."

      - alert: RelayAvailabilitySlowBurn
        expr: |
          (
            sum(rate(lurus_gateway_relay_total_duration_seconds_count{status!="success"}[6h]))
              / sum(rate(lurus_gateway_relay_total_duration_seconds_count[6h]))
          ) > (6 * 0.005)
          and
          (
            sum(rate(lurus_gateway_relay_total_duration_seconds_count{status!="success"}[30m]))
              / sum(rate(lurus_gateway_relay_total_duration_seconds_count[30m]))
          ) > (6 * 0.005)
        for: 15m
        labels:
          severity: page
          service: lurus-hub
          slo: relay-availability
        annotations:
          summary: "relay availability slow-burn — 5% of 30d error budget in <6h"
          description: "Relay error ratio >3% over both 6h and 30m. Sustained degradation; runbook doc/slo-relay.md."

      - alert: RelayOverheadFastBurn
        expr: |
          (
            1 - (
              sum(rate(lurus_gateway_relay_overhead_duration_seconds_bucket{le="0.05"}[1h]))
                / sum(rate(lurus_gateway_relay_overhead_duration_seconds_count[1h]))
            )
          ) > (14.4 * 0.01)
          and
          (
            1 - (
              sum(rate(lurus_gateway_relay_overhead_duration_seconds_bucket{le="0.05"}[5m]))
                / sum(rate(lurus_gateway_relay_overhead_duration_seconds_count[5m]))
            )
          ) > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
          service: lurus-hub
          slo: relay-overhead
        annotations:
          summary: "relay overhead fast-burn — newhub adding >50ms on too many requests"
          description: ">14.4% of relays exceed the 50ms overhead SLO over 1h AND 5m. Latency newhub OWNS — check channel-select + quota path, not upstream."
