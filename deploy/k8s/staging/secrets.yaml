# Staging secrets template for lurus-newhub.
# Values should be base64 encoded.
# Create actual secrets:
#   kubectl -n lurus-staging create secret generic lurus-newhub-staging-secrets \
#     --from-literal=SESSION_SECRET='your-staging-session-secret' \
#     --from-literal=SQL_DSN='postgres://lurus:password@postgres:5432/lurusnewhub_staging' \
#     --from-literal=OIDC_CLIENT_ID='staging-client-id' \
#     --from-literal=E2E_BRIDGE_TOKEN='random-32-hex-string-for-playwright'
#
# Or apply this template with actual values:
apiVersion: v1
kind: Secret
metadata:
  name: lurus-newhub-staging-secrets
  namespace: lurus-staging
  labels:
    app: lurus-newhub
    environment: staging
type: Opaque
stringData:
  # Session secret (generate: openssl rand -hex 32)
  SESSION_SECRET: "REPLACE_WITH_STAGING_SESSION_SECRET"
  # Staging database DSN (separate database/schema)
  SQL_DSN: "postgres://lurus:REPLACE_PASSWORD@100.94.177.10:30543/lurusnewhub_staging"
  # OIDC client ID for staging
  OIDC_CLIENT_ID: "REPLACE_WITH_STAGING_CLIENT_ID"
  # E2E bridge token (generate: openssl rand -hex 32) — keep empty in prod.
  E2E_BRIDGE_TOKEN: "REPLACE_WITH_RANDOM_HEX_FOR_PLAYWRIGHT"
