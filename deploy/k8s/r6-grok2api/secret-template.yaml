# Schema only — real values are NOT committed.
# Apply once on R6 (single-node; data under /data/grok2api):
#
#   openssl rand -hex 32 > /tmp/jwt
#   openssl rand -base64 32 > /tmp/cek
#   # Edit config.yaml: paste jwt/cek + strong bootstrapAdmin.password
#   kubectl -n lurus-grok2api create secret generic grok2api-config \
#     --from-file=config.yaml=/data/grok2api/config.yaml
#
# After first admin login: change password and remove bootstrapAdmin from config,
# then recreate the secret and restart the deploy.
apiVersion: v1
kind: Secret
metadata:
  name: grok2api-config
  namespace: lurus-grok2api
type: Opaque
stringData:
  config.yaml: |
    server:
      listen: "0.0.0.0:8000"
      swaggerEnabled: false
    auth:
      secureCookies: false
    secrets:
      jwtSecret: "REPLACE_WITH_openssl_rand_hex_32"
      credentialEncryptionKey: "REPLACE_WITH_openssl_rand_base64_32"
    bootstrapAdmin:
      username: "admin"
      password: "REPLACE_WITH_STRONG_PASSWORD"
    database:
      driver: sqlite
      sqlite:
        path: "./data/backend.db"
    runtimeStore:
      driver: memory
    media:
      driver: local
      local:
        path: "./data/media"
