# lurus-newhub-secrets — schema only.
# Real values are NOT committed. Apply via:
#   kubectl -n lurus-newhub create secret generic lurus-newhub-secrets \
#     --from-literal=SESSION_SECRET='<set-via-kubectl>' \
#     --from-literal=SQL_DSN='<set-via-kubectl>' \
#     --from-literal=IDENTITY_SERVICE_INTERNAL_KEY='<set-via-kubectl>' \
#     --from-literal=IDENTITY_SESSION_SECRET='<set-via-kubectl>' \
#     --from-literal=LURUS_WHITELABEL_MASTER_SECRET='<openssl rand -hex 32>' \
#     --from-literal=TAVILY_API_KEY='<set-via-kubectl, optional>'
# Or seal with sealed-secrets / external-secrets in the future.
# Key list verified against the LIVE secret 2026-08-15 (`kubectl get secret
# lurus-newhub-secrets -n lurus-newhub -o go-template` key-only dump, no values
# read/stored) — DATA=6, matches the 6 keys below exactly.
apiVersion: v1
kind: Secret
metadata:
  name: lurus-newhub-secrets
  namespace: lurus-newhub
type: Opaque
stringData:
  SESSION_SECRET: "<REDACTED-见重要信息.md>"
  SQL_DSN: "<REDACTED-见重要信息.md>"
  IDENTITY_SERVICE_INTERNAL_KEY: "<REDACTED-见重要信息.md>"
  IDENTITY_SESSION_SECRET: "<REDACTED-见重要信息.md>"
  # Phase D whitelabel HMAC master secret. 32-byte hex from `openssl rand -hex 32`.
  # Used to derive per-tenant HMAC keys via HKDF-SHA256 (see internal/whitelabel/hmac.go).
  LURUS_WHITELABEL_MASTER_SECRET: "<REDACTED-见重要信息.md>"
  # Lutu APP web_search tool key (Tavily). deployment.yaml references this key
  # with optional:true — the pod boots fine without it, /api/v2/lutu/search
  # just returns 503 search_disabled. Present on the LIVE secret (verified
  # 2026-08-15), so listed here for completeness.
  TAVILY_API_KEY: "<REDACTED-见重要信息.md>"
