apiVersion: apps/v1
kind: Deployment
metadata:
  name: lurus-newhub
  namespace: lurus-newhub
  labels:
    app: lurus-newhub
    environment: stage
spec:
  # 3 replicas (was 1) so the H1.3 DB-lease leader election can be drilled on
  # STAGE: kill the leader pod and confirm a standby takes over within the
  # lease TTL. Only the leader runs master-only background tasks.
  replicas: 3
  selector:
    matchLabels:
      app: lurus-newhub
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: lurus-newhub
        environment: stage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Pod security baseline (parity with base deploy/k8s/deployment.yaml):
      # non-root, drop fsGroup to the nobody uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: lurus-newhub
          # Pinned to an immutable digest (was floating "main"). History:
          # 2026-08-15 reconciled to the LIVE deployment (rev 38, tag
          # main-20260811-d12acb2, main@d12acb24, Publish run 31468773481,
          # provenance from that run's push log); the previous pin (718f31f7,
          # main@b6d96c91, 2026-07-16) had drifted because rolls were applied
          # to the cluster without bumping this file.
          # The `# pin:` line and the `image:` line below are AUTO-WRITTEN by
          # docker-image-main.yml (bump_r6_manifest job) after every :main
          # build, so this manifest always names the newest built image and
          # git is the desired state (cluster catches up on the next manual
          # ArgoCD sync / apply -k). Hand-edit only for an emergency pin, and
          # expect the next build to overwrite it.
          # GHCR repository name follows the GitHub repo name (hanmahong5-arch/lurus-newhub).
          # pin: main-20260823-721f62c run=32646114583
          image: ghcr.io/hanmahong5-arch/lurus-newhub@sha256:61fe8cca6ee37d96775194de79c874bc729674d63103b88396c3a92c07881db6
          imagePullPolicy: IfNotPresent
          # Container hardening (parity with base): no priv-escalation, read-only
          # root FS (writes go to the /data + /tmp emptyDirs below), drop all caps.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: TZ
              value: "Asia/Shanghai"
            - name: GIN_MODE
              value: "release"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: SESSION_SECRET
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: SQL_DSN
            - name: REDIS_CONN_STRING
              value: "redis://redis.lurus-system.svc.cluster.local:6379/2"
            - name: SESSION_COOKIE_DOMAIN
              value: "test-newhub.lurus.cn"
            - name: OIDC_ENABLED
              value: "false"
            - name: MEILISEARCH_ENABLED
              value: "false"
            - name: BILLING_UNIFIED_ENABLED
              value: "false"
            - name: IDENTITY_SERVICE_URL
              value: "http://platform-core.lurus-platform.svc.cluster.local:18104"
            - name: IDENTITY_GRPC_ADDR
              value: "platform-core.lurus-platform.svc.cluster.local:18105"
            - name: IDENTITY_PUBLIC_URL
              value: "https://identity.lurus.cn"
            - name: IDENTITY_SERVICE_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: IDENTITY_SERVICE_INTERNAL_KEY
            - name: IDENTITY_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: IDENTITY_SESSION_SECRET
            - name: LURUS_WHITELABEL_MASTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: LURUS_WHITELABEL_MASTER_SECRET
            - name: ALLOWED_ORIGINS
              # identity.lurus.cn is the OIDC issuer (IDENTITY_PUBLIC_URL); its
              # origin must be allowed for the SSO callback/CORS to work.
              value: "https://test-newhub.lurus.cn,https://identity.lurus.cn"
            - name: LLM_QUOTA_NATS_ENABLED
              value: "true"
            - name: NATS_URL
              # In-cluster NATS (ns messaging). The old R5 bridge
              # 100.120.110.73:14222 is dead; the LLM_EVENTS stream and the
              # lurus-notification consumer both live on this cluster's NATS.
              value: "nats://nats.messaging.svc:4222"
            - name: LLM_QUOTA_NATS_STREAM
              value: "LLM_EVENTS"
            - name: NODE_TYPE
              value: "master"
            - name: SYNC_FREQUENCY
              value: "60"
            - name: GRACEFUL_SHUTDOWN_TIMEOUT
              value: "30s"
            - name: LOG_FORMAT
              value: "json"
            # Lutu APP web_search tool — proxies to Tavily server-side
            # so the API key stays off-device. When missing the
            # /api/v2/lutu/search endpoint returns 503 search_disabled.
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lurus-newhub-secrets
                  key: TAVILY_API_KEY
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          # Liveness stays SHALLOW (/api/status) — see base deployment.yaml for
          # the full P0-2 rationale (no restart on dependency blips).
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          # Readiness is DEEP (/api/health): a DB-down pod leaves the Service.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
