# ArgoCD Application for the live r6-stage overlay.
#
# Registered 2026-08-15 to close the "runs on the cluster but invisible to
# GitOps" gap: the lurus-newhub workload had been maintained by hand-applying
# this directory, so digest drift between git and the cluster went unnoticed
# (git sat on main@b6d96c91 from 07-16 while the cluster was rolled to
# main@d12acb24 on 08-11).
#
# Sync policy is DELIBERATELY manual — no `automated`, no selfHeal:
#   * the repo is public, so ArgoCD needs no credentials to compare, and the
#     app gives a truthful Synced/OutOfSync signal essentially for free;
#   * an automated policy would have ROLLED BACK the cluster to the stale git
#     digest at registration time — reconcile git first, then (owner call)
#     consider automation once a digest-bump-on-build step exists in CI.
#
# Apply with: kubectl apply -f argocd-application.yaml
# Remove with: kubectl -n argocd delete application lurus-newhub-r6-stage
# (removal does not touch the workload: no finalizer, manual sync only).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lurus-newhub-r6-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hanmahong5-arch/lurus-newhub.git
    targetRevision: main
    path: deploy/k8s/r6-stage
  destination:
    server: https://kubernetes.default.svc
    namespace: lurus-newhub
  # Mirrors the lucrum-web app's noise filters: replica count is a runtime
  # decision (HPA/manual scale), rollout bookkeeping annotations churn on
  # every roll.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - kind: Deployment
      jqPathExpressions:
        - .metadata.annotations."deployment.kubernetes.io/revision"
        - .metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"
  # No syncPolicy block at all = manual sync, no pruning, no self-heal.
