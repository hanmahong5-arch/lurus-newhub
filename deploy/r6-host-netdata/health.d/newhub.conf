# Netdata health alarms for lurus-newhub (LLM gateway + billing).
#
# PROVENANCE: adopted verbatim from the R6 host's live copy (mtime
# 2026-08-20, itself ported from the now-deleted deploy/grafana/newhub-alerts.yaml
# — commit e0425425 removed that file along with the rest of deploy/grafana/,
# so it is no longer this repo's tuning source of truth). Adopted into this
# repo 2026-09-15; three new alarms merged in the same day (see the
# "PROVOKABLE ON DEMAND" section below). THIS FILE is now the source of
# truth — edit it here, then re-run scripts/install-netdata-alarms.sh; do
# not hand-edit the host copy, the next install silently overwrites it.
#
# STATUS: repo copy last synced from the host 2026-08-20; three new alarms
# added 2026-09-16. Re-installation onto R6 after that addition is
# OPERATOR-RUN and PENDING as of 2026-09-16 — see
# deploy/r6-host-netdata/README.md "Install" for the command and
# internal/pkg/metrics/alert_wiring_honesty_test.go for the gate that keeps
# this line from silently going stale.
#
# Mounted per-file (not directory) read-only into the obs-netdata CONTAINER
# at /etc/netdata/health.d/newhub.conf, bind-sourced from
# /data/obs-pack/runtime/netdata/config/health.d/newhub.conf on the host —
# a new file dropped into that host directory is NOT picked up until the
# bind source itself is written (see the install script). Scrape job is the
# `newhub` target in go.d/prometheus.conf (http://localhost:30850/metrics),
# one NodePort round-robining across 3 replicas — see the "PROVOKABLE ON
# DEMAND" section header below for what that means for `lookup:` arithmetic.
#
# ════════════════════════════════════════════════════════════════════════════
# Chart naming (operator-verified against the live host, 2026-09-15):
#   • context = prometheus.newhub.<metric>   (job = newhub)
#   • chart id = prometheus_newhub.<metric>-<label>=<value>...  — one chart
#     per label-set, single dimension named after the metric, counters
#     rate-converted by go.d, update_every = 10s.
#   • label filter via `chart labels: <k>=<v>`  (NOT `lookup of <dim>`)
#   • CRITICAL → email+webhook; WARNING → webhook only IF
#     health_alarm_notify.conf's role_recipients_custom[sysadmin] resolves to
#     a real destination — SEND_EMAIL=NO, SEND_CUSTOM=YES on this host, so
#     "email" above does not currently apply. See README.md "Ownership
#     boundary": this repo proves an alarm state-transitions and is visible
#     in netdata's API, not that a human receives it.
#
# Metric namespaces (DO NOT drift — the 2026-05-18 incident was 11 rules dead
# for months on a lurus_hub_* vs lurus_gateway_* mismatch):
#   gateway metrics → lurus_gateway_*   (relay/availability/quota/credit-pool)
#   billing metrics → lurus_billing_*   (settlement breaker/outbox)
#   a handful of metrics (ratelimit.go, reconcile.go) intentionally omit the
#   lurus_gateway_ prefix — see their own doc comments in
#   internal/pkg/metrics/ for why; internal/pkg/metrics/netdata_alarm_series_test.go
#   parses each metric's actual Namespace/Subsystem/Name fields rather than
#   assuming the common prefix, so it does not mis-resolve these.
#
# THE REPO ORACLE (internal/pkg/metrics/netdata_alarm_series_test.go):
# TestNetdataAlarmsNameOnlyLiveSeries resolves every non-DEAD block's `on:`
# line (the line netdata itself reads) to a Prometheus series and fails the
# build if that series is not declared AND actually written by production
# code, or if the "# series:" annotation above the block disagrees with what
# `on:` resolves to. TestNetdataAlarmsRequireSeriesAnnotation fails if any
# non-DEAD block is missing that annotation. TestNetdataAlarmsChartLabelKeysAreDeclared
# fails if a `chart labels:` filter names a label KEY the metric's vector
# does not declare. None of these three can observe whether netdata
# currently has a CHART bound for a given label combination — that is live,
# data-dependent state this repo cannot see from a checkout; the "LIVE
# STATUS" comments above several blocks below record what the operator
# observed on the host directly, dated, because the oracle cannot.
# ════════════════════════════════════════════════════════════════════════════


# ════════════════════════════════════════════════════════════════════════════
# MONEY PATH (CRITICAL → email+webhook) — settlement / credit pool
# ════════════════════════════════════════════════════════════════════════════

# Platform billing breaker open (PlatformBreakerOpen, severity=page). Settlement
# to lurus-platform halted: quota consumed but wallet NOT debited — revenue leak.
# State gauge: 1 = open.
# runbook: doc/runbook/platform-billing-breaker-open.md
# series: lurus_billing_circuit_breaker_state
template: newhub_platform_breaker_open
      on: prometheus.newhub.lurus_billing_circuit_breaker_state
   class: Errors
    type: System
component: newhub
  lookup: max -5m
   units: state
   every: 30s
    crit: $this >= 1
   delay: down 5m
    info: newhub→platform billing breaker OPEN — pre-auths not settling, quota consumed but wallet not debited; check platform health
      to: sysadmin

# Billing outbox permanent failures (BillingOutboxFailures). Promoted to CRITICAL
# per the plan's收款断流 set — pre-auths exhausted retries = manual reconciliation
# = real money discrepancy.
# runbook: doc/runbook/billing-outbox-failures.md
# series: lurus_billing_outbox_failed_total
template: newhub_billing_outbox_failures
      on: prometheus.newhub.lurus_billing_outbox_failed_total
   class: Errors
    type: System
component: newhub
  lookup: average -1h
   units: ops/s
   every: 1m
    crit: $this > 0
   delay: down 5m
    info: pre-auth(s) permanently failed (max retries) — manual reconciliation needed, see billing runbook
      to: sysadmin

# Tenant credit pool low/exhausted (CreditPoolBalanceLow + CreditPoolExhausted).
# Labelled per tenant_id → one chart per tenant; the template fans out to one
# alarm per tenant, so the alarm value identifies the tenant directly. One rule
# covers both thresholds: exhausted (≤0, CRITICAL — relay 402s) and low
# (0<bal<1000, WARNING).
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches prometheus.newhub.lurus_gateway_credit_pool_balance.
# The series is declared and written (internal/pkg/metrics/metrics.go
# CreditPoolBalance, set from internal/app/quota.go and
# internal/adapter/handler/tenant_credit_pool.go), so this is not a code
# defect this repo's oracle can detect — the gauge simply has not been Set()
# for any tenant since netdata's go.d job started scraping (production has
# had effectively no chargeable relay traffic). Re-check chart binding after
# any tenant does a real relay call through a pooled token.
# runbook: doc/runbook/credit-pool-low.md
# series: lurus_gateway_credit_pool_balance
template: newhub_credit_pool
      on: prometheus.newhub.lurus_gateway_credit_pool_balance
   class: Utilization
    type: System
component: newhub
  lookup: min -5m
   units: quota units
   every: 1m
    warn: $this > 0 AND $this < 1000
    crit: $this <= 0
   delay: down 10m
    info: tenant credit pool low (<1000) or EXHAUSTED (≤0 → relay returning HTTP 402); page Reseller for topup
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# RELIABILITY / SATURATION (WARNING → webhook only)
# ════════════════════════════════════════════════════════════════════════════

# Channel circuit breaker stuck open (ChannelBreakerStuckOpen, ticket). Labelled
# per channel_id → one alarm per channel; fires on the channel whose breaker is open.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches prometheus.newhub.lurus_gateway_circuit_breaker_state.
# The series is declared and written (metrics.CircuitBreakerState, set from
# internal/adapter/handler/relay.go via metrics.RecordCircuitBreakerState), so
# this is not a code defect this repo's oracle can detect — no channel's
# breaker has tripped Open since the go.d job started scraping. To manually
# disable a misbehaving channel: PUT /api/v2/{tenant_slug}/channels/{id} with
# status=2 (common.ChannelStatusManuallyDisabled).
# runbook: doc/runbook/channel-breaker-open.md
# series: lurus_gateway_circuit_breaker_state
template: newhub_channel_breaker_open
      on: prometheus.newhub.lurus_gateway_circuit_breaker_state
   class: Errors
    type: System
component: newhub
  lookup: max -30m
   units: state
   every: 1m
    warn: $this >= 1
   delay: down 30m
    info: a relay channel breaker has been open ≥30m — confirm upstream provider healthy or disable the channel (alarm names the channel_id)
      to: sysadmin

# Billing outbox backlog (BillingOutboxBacklog, ticket). Settlement-retry queue
# growing — platform slow or a dequeue bug.
# runbook: doc/runbook/billing-outbox-backlog.md
# series: lurus_billing_outbox_pending
template: newhub_billing_outbox_backlog
      on: prometheus.newhub.lurus_billing_outbox_pending
   class: Utilization
    type: System
component: newhub
  lookup: max -5m
   units: items
   every: 1m
    warn: $this > 100
   delay: down 15m
    info: billing outbox depth >100 — settlement-retry queue growing; platform slow or dequeue bug
      to: sysadmin

# Hub 5xx absolute floor (substitutes HubAvailabilityBelowSLO/Critical). The
# source rules are availability RATIOS (1 - 5xx/total); Netdata `lookup` can't
# divide cross-series rates, so this is the portable absolute-rate half. `5*`
# simple pattern matches status 500/502/503/504. One alarm per 5xx code.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): bound and
# CLEAR, but ONLY to the path=/api/health status=503 chart — this alarm
# watches health-check 503s, not general relay 5xx traffic (lurus_gateway_
# requests_total counts every HTTP request, console included; the relay
# path apparently has not produced a matching 5*-labelled chart yet). Do not
# read a WARNING here as "the relay is failing" without also checking
# newhub_upstream_5xx_burst below.
# runbook: doc/runbook/relay-5xx-elevated.md
# series: lurus_gateway_requests_total
template: newhub_relay_5xx_elevated
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=5*
   class: Errors
    type: Web Server
component: newhub
  lookup: average -5m
   units: req/s
   every: 1m
    warn: $this > 0.05
   delay: down 10m
    info: newhub relay sustained 5xx (bound to path=/api/health only as of 2026-09-15 — see comment above) — upstream provider health / channel selection; availability-ratio SLO not portable to Netdata (see NOT ported)
      to: sysadmin
# ⚠VERIFY: `status=5*` relies on netdata simple-pattern matching of the chart
# label value (same as platform_http_5xx_elevated). Fall back to per-code if not.

# Cost-spike 429 burst (CostSpikeBurstHigh, ticket) — many users hitting the
# 5-min quota guard at once.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches status=429 on this series. The underlying
# series is declared and written for every HTTP status including 429
# (internal/pkg/metrics/middleware.go's generic per-request recorder), so
# this is not a code defect this repo's oracle can detect — production has
# not returned a 429 since the go.d job started scraping (near-zero
# chargeable traffic).
# runbook: doc/runbook/cost-spike-429.md
# series: lurus_gateway_requests_total
template: newhub_cost_spike_429
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=429
   class: Workload
    type: Web Server
component: newhub
  lookup: average -5m
   units: req/s
   every: 1m
    warn: $this > 1
   delay: down 5m
    info: cost-spike 429s >1/s — multiple users hitting the 5-min quota guard simultaneously
      to: sysadmin

# Quota-cap 402 burst (QuotaCapBurstHigh, info) — many users at MaxQuota.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches status=402 on this series, for the same
# reason as newhub_cost_spike_429 above (series is written for any status
# code; production has not returned a 402 since the go.d job started
# scraping).
# runbook: doc/runbook/quota-cap-402.md
# series: lurus_gateway_requests_total
template: newhub_quota_cap_402
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=402
   class: Workload
    type: Web Server
component: newhub
  lookup: average -10m
   units: req/s
   every: 1m
    warn: $this > 5
   delay: down 10m
    info: 402 quota-capped >5/s — many users at MaxQuota (likely billing day); investigate if accelerating
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# PROVOKABLE ON DEMAND (cycle 9 first batch) — each can be driven live via the
# UAT fault simulator or a bounded Redis interruption and proved CLEAR ->
# WARNING -> CLEAR in the netdata alarm API; see the linked runbook's
# "Provoking this alarm on demand" section for the exact recipe.
#
# SCRAPE TOPOLOGY (applies to every alarm in this section): the go.d
# `prometheus` job scrapes ONE NodePort (http://localhost:30850/metrics) that
# round-robins across 3 replicas (deploy/k8s/r6-stage/deployment.yaml
# replicas: 3) at update_every = 10s. A counter's rate-converted dimension is
# therefore a per-replica sample, not a gateway-wide rate: consecutive
# scrapes can land on different replicas, so a real burst confined to one
# replica can be invisible on the scrapes that land elsewhere, and switching
# between two replicas with very different lifetime totals can produce a
# spurious delta. `lookup: average -Nm` on the rate-converted dimension is
# used throughout (never `sum`, which only equals an event count if the
# collection interval were 1s — it is 10s here). Thresholds below are
# first-cut and NOT calibrated against live data; the operator records the
# measured rate during the UAT probe and revises them then.
# ════════════════════════════════════════════════════════════════════════════

# Upstream 5xx burst (an upstream provider failing with 5xx, distinct from
# newhub_relay_5xx_elevated above which is bound to health-check 503s only).
# error_type=upstream_5xx is types.RelayErrorType's fail-safe bucket:
# explicit 5xx, a failed transport-level request, or channel-capacity
# exhaustion with no status — internal/pkg/types/error.go.
# runbook: doc/runbook/upstream-5xx-burst.md
# series: lurus_gateway_relay_errors_total
alarm: newhub_upstream_5xx_burst
      on: prometheus.newhub.lurus_gateway_relay_errors_total
chart labels: error_type=upstream_5xx
   class: Errors
    type: Web Server
component: newhub
  lookup: average -5m
   units: errors/s
   every: 30s
    warn: $this > 0.02
    crit: $this > 0.1
   delay: down 10m
    info: lurus_gateway_relay_errors_total{error_type="upstream_5xx"} rate rising — an upstream provider is failing with 5xx; threshold not yet calibrated against live traffic (see file header). Runbook: doc/runbook/upstream-5xx-burst.md
      to: sysadmin

# Rate-limit fail-open degradation — a rate limiter's Redis backend call
# failed. The `check` label distinguishes a genuine fail-open admission
# (model_rate_limit_success, model_rate_limit_total) from a lost SUCCESS
# recording that is not a fail-open at all (model_rate_limit_record — the
# request already succeeded); the alarm cannot tell these apart from the
# aggregate rate alone, so the info text says so instead of pretending
# otherwise. See internal/pkg/metrics/r6_rate_limit_degraded.go and
# doc/runbook/rate-limit-degraded.md.
# runbook: doc/runbook/rate-limit-degraded.md
# series: lurus_gateway_rate_limit_degraded_total
alarm: newhub_rate_limit_degraded
      on: prometheus.newhub.lurus_gateway_rate_limit_degraded_total
   class: Errors
    type: System
component: newhub
  lookup: average -5m
   units: events/s
   every: 30s
    warn: $this > 0
    crit: $this > 0.2
   delay: down 10m
    info: rate_limit_degraded_total rate rising — a rate limiter's Redis call failed: either a fail-open admission or a lost success recording; read the check label on /metrics before acting (see runbook). Runbook: doc/runbook/rate-limit-degraded.md
      to: sysadmin

# Failover suppressed surge — upstream dropped a request mid-stream and a
# retry was deliberately withheld to avoid corrupting an already-started
# client response (FailoverSuppressedTotal, internal/pkg/metrics/metrics.go).
# A demand signal, not a routing error: relay_failover_total structurally
# cannot show these (the request never reaches a second channel).
# runbook: doc/runbook/failover-suppressed-surge.md
# series: lurus_gateway_relay_failover_suppressed_total
alarm: newhub_failover_suppressed_surge
      on: prometheus.newhub.lurus_gateway_relay_failover_suppressed_total
   class: Workload
    type: Web Server
component: newhub
  lookup: average -5m
   units: events/s
   every: 30s
    warn: $this > 0.01
    crit: $this > 0.05
   delay: down 10m
    info: relay_failover_suppressed_total rate rising — upstreams dropping requests mid-stream, retries withheld to protect an already-started client response. Runbook: doc/runbook/failover-suppressed-surge.md
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# NOT ported (Netdata-can't / coarser — README "Honest gaps")
# ════════════════════════════════════════════════════════════════════════════
#  • HubAvailabilityBelowSLO / HubAvailabilityCritical — (1 - 5xx/total)*100 SLO
#    ratios; Netdata `lookup` can't divide two cross-series rates. Substituted by
#    newhub_relay_5xx_elevated (absolute floor).
#  • HubP95LatencyHigh / HubGatewayOverheadHigh — histogram_quantile(0.95, ...);
#    Netdata has no quantile-over-buckets.
#  • ChannelBreakerFlapping — changes(state[10m])>5; Netdata `lookup` has no
#    state-transition count. The stuck-open alarm covers the worse failure mode.
