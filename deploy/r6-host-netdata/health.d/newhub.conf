# newhub netdata alarms — INSTALLED (not reference-only).
#
# Ownership: this file lives in the newhub repo (deploy/r6-host-netdata/,
# same directory-as-source-of-truth shape as deploy/r6-host-nginx/) and is
# copied onto the R6 host's netdata config by scripts/install-netdata-alarms.sh.
# Netdata itself never reads this repo checkout — only the copy under
# /etc/netdata/health.d/newhub.conf (or the stock-config equivalent under
# /usr/lib/netdata/conf.d/health.d/, see README.md) is live. Re-run the
# install script after editing this file to update the host.
#
# Contrast with deploy/k8s/r6-stage/newhub-prometheus-rule.yaml, whose own
# header marks it "not deployed" — no Prometheus Operator runs on R6, so
# nothing ever evaluates it. THIS file is different: these alarms are
# netdata-native and read the same /metrics endpoint netdata's go.d
# "prometheus" job "newhub" already scrapes (deploy/r6-host-netdata/README.md
# has the job config). internal/pkg/metrics/alert_wiring_honesty_test.go
# asserts this file does NOT carry that undeployed marker and DOES name the
# install script above, so the two files cannot silently swap meaning.
#
# Scope: first batch only — alarms that can be provoked on demand so each one
# gets a live before/after proof (see the runbook page linked per alarm and
# the operator's UAT probe). Delivery to a human is a separate, unverified-here
# concern: see README.md "Honest limit".
#
# THE REPO ORACLE: every alarm below carries a "# series: <name>" comment
# immediately above its `alarm:` line, naming the raw Prometheus series (as
# exposed on /metrics, i.e. namespace_subsystem_name) that the alarm's `on:`
# chart is derived from. internal/pkg/metrics/netdata_alarm_series_test.go
# parses these comments and fails the build if the named series has no
# production writer (declared-but-unwritten) or does not exist at all
# (typo'd or renamed out from under the alarm). Netdata itself ignores the
# "# series:" comments; they exist for the repo test, not for the daemon.
#
# Chart naming caveat: netdata's go.d "prometheus" collector derives chart
# contexts/dimensions from the scraped metric and label set at run time —
# this cannot be verified from a checkout with no netdata process to ask.
# Confirm the `on:` context and dimension names against the live host before
# trusting a threshold (README.md "Verifying chart names").

# series: lurus_gateway_relay_errors_total
alarm: newhub_upstream_5xx_burst
   on: prometheus_local_newhub.lurus_gateway_relay_errors_total
   lookup: sum -5m unaligned of *upstream_5xx*
   units: errors
   every: 30s
   warn: $this > 5
   crit: $this > 20
   delay: down 5m multiplier 1.5 max 1h
   info: relay_errors_total{error_type="upstream_5xx"} rising — an upstream provider is failing with 5xx. Runbook: doc/runbook/upstream-5xx-burst.md
   to: sysadmin

# series: lurus_gateway_rate_limit_degraded_total
alarm: newhub_rate_limit_degraded
   on: prometheus_local_newhub.lurus_gateway_rate_limit_degraded_total
   lookup: sum -5m unaligned of *
   units: events
   every: 30s
   warn: $this > 0
   crit: $this > 50
   delay: down 5m multiplier 1.5 max 1h
   info: rate_limit_degraded_total rising — a rate limiter's Redis backend call failed and fell back to fail-open (admitting traffic it would otherwise reject). Runbook: doc/runbook/rate-limit-degraded.md
   to: sysadmin

# series: lurus_gateway_relay_failover_suppressed_total
alarm: newhub_failover_suppressed_surge
   on: prometheus_local_newhub.lurus_gateway_relay_failover_suppressed_total
   lookup: sum -5m unaligned of *
   units: events
   every: 30s
   warn: $this > 3
   crit: $this > 15
   delay: down 5m multiplier 1.5 max 1h
   info: relay_failover_suppressed_total rising — upstreams are dropping requests mid-stream and retries are being withheld to avoid corrupting an already-started client response. Runbook: doc/runbook/failover-suppressed-surge.md
   to: sysadmin
