#
# newhub_channel_cache_stale exists because the same lane deliberately traded
# a loud failure for a silent one: a channel-cache rebuild whose database read
# fails now keeps the previously built routing table instead of swapping in
# the failed query's empty result. Emptying the table announced itself as "no
# available channel" within minutes; keeping it is the better failure but it
# is invisible — a channel disabled or key-rotated during the incident keeps
# serving, a channel added during it gets no traffic on that replica. The
# counter lurus_gateway_channel_cache_sync_failed_total is what this alarm
# turns back into a signal, so the trade is not "loud bug for silent bug".
#
# newhub_db_slow_queries watches lurus_gateway_db_slow_query_total rather
# than the go_sql_wait_count_total pool gauge an operator might expect for a
# saturation alarm: this repo's oracle
# (internal/pkg/metrics/netdata_alarm_series_test.go) resolves an `on:` line
# by scanning promauto declarations in internal/pkg/metrics, and the go_sql_*
# series come from prometheus/client_golang's NewDBStatsCollector instead, so
# an alarm bound to one of them could be renamed out from under and stay
# silent forever with nothing failing. GORM's measured statement time
# INCLUDES the wait for a pooled connection (gorm.io/gorm/callbacks.go takes
# its start timestamp before the connection is acquired), so a saturating
# pool does show up on this counter; the go_sql_* gauges are what separate
# "pool saturated" from "database slow", and doc/runbook/db-pool-saturation.md
# is written around reading the two together.
#
