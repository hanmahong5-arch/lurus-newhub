# a new file dropped into that host directory is NOT picked up until the
# bind source itself is written (see the install script). Scrape job is the
# `newhub` target in go.d/prometheus.conf (http://localhost:30850/metrics),
# one NodePort round-robining across 3 replicas — see the "PROVOKABLE ON
# DEMAND" section header below for what that means for `lookup:` arithmetic.
#
# ════════════════════════════════════════════════════════════════════════════
# Chart naming (operator-verified against the live host, 2026-09-15):
#   • context = prometheus.newhub.<metric>   (job = newhub)
#   • chart id = prometheus_newhub.<metric>-<label>=<value>...  — one chart
#     per label-set, single dimension named after the metric, counters
#     rate-converted by go.d, update_every = 10s.
#   • label filter via `chart labels: <k>=<v>`  (NOT `lookup of <dim>`)
#   • CRITICAL → email+webhook; WARNING → webhook only IF
#     health_alarm_notify.conf's role_recipients_custom[sysadmin] resolves to
#     a real destination — SEND_EMAIL=NO, SEND_CUSTOM=YES on this host, so
#     "email" above does not currently apply. See README.md "Ownership
#     boundary": this repo proves an alarm state-transitions and is visible
#     in netdata's API, not that a human receives it.
#
# Metric namespaces (DO NOT drift — the 2026-05-18 incident was 11 rules dead
# for months on a lurus_hub_* vs lurus_gateway_* mismatch):
#   gateway metrics → lurus_gateway_*   (relay/availability/quota/credit-pool)
#   billing metrics → lurus_billing_*   (settlement breaker/outbox)
#   a handful of metrics (ratelimit.go, reconcile.go) intentionally omit the
#   lurus_gateway_ prefix — see their own doc comments in
#   internal/pkg/metrics/ for why; internal/pkg/metrics/netdata_alarm_series_test.go
#   parses each metric's actual Namespace/Subsystem/Name fields rather than
#   assuming the common prefix, so it does not mis-resolve these.
#
# THE REPO ORACLE (internal/pkg/metrics/netdata_alarm_series_test.go):
# TestNetdataAlarmsNameOnlyLiveSeries resolves every non-DEAD block's `on:`
# line (the line netdata itself reads) to a Prometheus series and fails the
# build if that series is not declared AND actually written by production
# code, or if the "# series:" annotation above the block disagrees with what
# `on:` resolves to. TestNetdataAlarmsRequireSeriesAnnotation fails if any
# non-DEAD block is missing that annotation. TestNetdataAlarmsChartLabelKeysAreDeclared
# fails if a `chart labels:` filter names a label KEY the metric's vector
# does not declare. None of these three can observe whether netdata
# currently has a CHART bound for a given label combination — that is live,
# data-dependent state this repo cannot see from a checkout; the "LIVE
# STATUS" comments above several blocks below record what the operator
# observed on the host directly, dated, because the oracle cannot.
# ════════════════════════════════════════════════════════════════════════════


# ════════════════════════════════════════════════════════════════════════════
# MONEY PATH (CRITICAL → email+webhook) — settlement / credit pool
# ════════════════════════════════════════════════════════════════════════════

# Platform billing breaker open (PlatformBreakerOpen, severity=page). Settlement
# to lurus-platform halted: quota consumed but wallet NOT debited — revenue leak.
# State gauge: 1 = open.
# runbook: doc/runbook/platform-billing-breaker-open.md
# series: lurus_billing_circuit_breaker_state
template: newhub_platform_breaker_open
      on: prometheus.newhub.lurus_billing_circuit_breaker_state
   class: Errors
    type: System
component: newhub
  lookup: max -5m
   units: state
   every: 30s
    crit: $this >= 1
   delay: down 5m
    info: newhub→platform billing breaker OPEN — pre-auths not settling, quota consumed but wallet not debited; check platform health
      to: sysadmin

# Billing outbox permanent failures (BillingOutboxFailures). Promoted to CRITICAL
# per the plan's收款断流 set — pre-auths exhausted retries = manual reconciliation
# = real money discrepancy.
# runbook: doc/runbook/billing-outbox-failures.md
# series: lurus_billing_outbox_failed_total
template: newhub_billing_outbox_failures
      on: prometheus.newhub.lurus_billing_outbox_failed_total
   class: Errors
    type: System
component: newhub
  lookup: average -1h
   units: ops/s
   every: 1m
    crit: $this > 0
   delay: down 5m
    info: pre-auth(s) permanently failed (max retries) — manual reconciliation needed, see billing runbook
      to: sysadmin

# Tenant credit pool low/exhausted (CreditPoolBalanceLow + CreditPoolExhausted).
# Labelled per tenant_id → one chart per tenant; the template fans out to one
# alarm per tenant, so the alarm value identifies the tenant directly. One rule
# covers both thresholds: exhausted (≤0, CRITICAL — relay 402s) and low
# (0<bal<1000, WARNING).
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches prometheus.newhub.lurus_gateway_credit_pool_balance.
# The series is declared and written (internal/pkg/metrics/metrics.go
# CreditPoolBalance, set from internal/app/quota.go and
# internal/adapter/handler/tenant_credit_pool.go), so this is not a code
# defect this repo's oracle can detect — the gauge simply has not been Set()
# for any tenant since netdata's go.d job started scraping (production has
# had effectively no chargeable relay traffic). Re-check chart binding after
# any tenant does a real relay call through a pooled token.
# runbook: doc/runbook/credit-pool-low.md
# series: lurus_gateway_credit_pool_balance
template: newhub_credit_pool
      on: prometheus.newhub.lurus_gateway_credit_pool_balance
   class: Utilization
    type: System
component: newhub
  lookup: min -5m
   units: quota units
   every: 1m
    warn: $this > 0 AND $this < 1000
    crit: $this <= 0
   delay: down 10m
    info: tenant credit pool low (<1000) or EXHAUSTED (≤0 → relay returning HTTP 402); page Reseller for topup
      to: sysadmin

# Settlement failure (newhub_settlement_failed, cycle-11 L7). A consume-quota
# settlement call (app.SettleConsume, one of relay.postConsumeQuota /
# app.PostClaudeConsumeQuota / app.PostAudioConsumeQuota) returned an error.
# Other PostConsumeQuota callers (mjproxy_handler.go, relay_task.go,
# quota.go's PostWssConsumeQuota) are not covered — see
# doc/runbook/settlement-failed.md's "Not covered this cycle" section. The
# consume log row is still written at the quota it would have carried
# anyway (see internal/app/settlement_outcome.go) — this counter, together
# with that row's own other.settlement="failed" flag, is the only signal on
# the row itself that the debit behind the shown charge may not have
# actually happened. Labelled per relay path (text/claude/audio) → one chart
# per path.
#
# Added 2026-09-19, IN-REPO ONLY — see this file's "STATUS UPDATE 2026-09-19"
# header note above; not yet installed onto R6 by this lane.
# runbook: doc/runbook/settlement-failed.md
# series: lurus_billing_settlement_failed_total
template: newhub_settlement_failed
      on: prometheus.newhub.lurus_billing_settlement_failed_total
   class: Errors
    type: System
component: newhub
  lookup: average -5m
   units: ops/s
   every: 1m
    warn: $this > 0
   delay: down 10m
    info: consume-quota settlement failed (path in the chart label) — the log row for that request still shows a charge, but the debit behind it may not have landed; see doc/runbook/settlement-failed.md
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# RELIABILITY / SATURATION (WARNING → webhook only)
# ════════════════════════════════════════════════════════════════════════════

# Database statements crossing the slow threshold (cycle-12 L8). Counted by
# the GORM logger (internal/adapter/repo/gorm_logger.go, gormLogger.Trace)
# for every statement over DB_SLOW_QUERY_MS (default 200ms), labelled per
# pool (db=newhub / newhub_log) → one chart per pool.
#
# Two causes, which this alarm cannot separate on its own: the database is
# slow, or the connection pool is saturated and callers are queueing for a
# connection (GORM's elapsed time covers that wait). The go_sql_* gauges from
# metrics.RegisterDBStats on the same /metrics page are what tells them
# apart — go_sql_wait_count_total climbing alongside means the pool; flat
# means the database. The runbook is written around reading the pair.
#
# Threshold is a first cut, NOT calibrated against live data (production has
# had near-zero chargeable traffic): 0.05/s is roughly three slow statements
# a minute on the replica that happened to be scraped. Record the measured
# rate during the UAT probe and revise. Read that number with the SCRAPE
# TOPOLOGY note further down in mind — one NodePort round-robins across the
# 3 replicas, so the rate-converted dimension is a per-replica sample and not
# a gateway-wide rate.
#
# A KNOWN STRUCTURAL SOURCE, named here so the first calibration does not
# spend a day rediscovering it: repo.rebuildChannelCache issues two
# unfiltered full-table reads (SELECT * over `channels`, then over
# `abilities`) on every replica every SYNC_FREQUENCY (60s on r6-stage), and
# `abilities` carries one row per channel x group x model. On a customer with
# real data those two statements alone can cross DB_SLOW_QUERY_MS: 2
# statements / 60s = 0.033/s on one replica, 0.1/s across three — the same
# order as this threshold, before a single customer request is counted. If
# the alarm sits at WARNING with go_sql_wait_count_total flat and the only
# `SLOW SQL` lines naming channel_cache.go, that is this and not an incident:
# raise DB_SLOW_QUERY_MS or this threshold, and write the measured rate down.
# A permanently-WARNING alarm is worth exactly as much as one that never
# changes state.
#
# Added 2026-09-19, IN-REPO ONLY — see this file's "STATUS UPDATE 2026-09-19
# (cycle-12 L8)" header note above, which also explains why this is bound to
# the slow-query counter rather than to go_sql_wait_count_total.
# runbook: doc/runbook/db-pool-saturation.md
# series: lurus_gateway_db_slow_query_total
template: newhub_db_slow_queries
      on: prometheus.newhub.lurus_gateway_db_slow_query_total
   class: Latency
    type: Database
component: newhub
  lookup: average -5m
   units: queries/s
   every: 1m
    warn: $this > 0.05
   delay: down 10m
    info: database statements are crossing the slow threshold (DB_SLOW_QUERY_MS, default 200ms) — either PostgreSQL is slow or the connection pool is saturated; read go_sql_wait_count_total on /metrics to tell which. Runbook: doc/runbook/db-pool-saturation.md
      to: sysadmin

# Channel-cache rebuild abandoned on a failed database read (cycle-12 L8).
# Counted by repo.rebuildChannelCache (internal/adapter/repo/channel_cache.go)
# once per abandoned pass, labelled by which of its two reads failed
# (query=channels / query=abilities) → one chart per read.
#
# What a nonzero rate MEANS: this replica's relay routing table is STALE, not
# empty. It kept the last table it built from a complete read, so a channel
# disabled, key-rotated or deleted since then may still be serving, and a
# channel added since then gets no traffic on this replica. Routing is
# otherwise normal, which is exactly why this needs an alarm: nothing else
# about the replica looks wrong.
#
# Threshold is any sustained nonzero rate — zero is the normal value, and the
# chart exists from boot rather than appearing on first failure, because both
# label values are pre-registered at 0 (internal/pkg/metrics/db_observability.go
# init()). That is what stops "no chart" from reading as "no failures".
#
# Added 2026-09-19, IN-REPO ONLY — see this file's "STATUS UPDATE 2026-09-19
# (cycle-12 L8)" header note above.
# runbook: doc/runbook/db-pool-saturation.md
# series: lurus_gateway_channel_cache_sync_failed_total
template: newhub_channel_cache_stale
      on: prometheus.newhub.lurus_gateway_channel_cache_sync_failed_total
   class: Errors
    type: Database
component: newhub
  lookup: average -5m
   units: rebuilds/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: channel-cache rebuilds are being abandoned on a failed database read — this replica's relay routing table is STALE (it kept the last complete table instead of emptying itself), so a channel disabled or rotated since then may still be serving. Runbook: doc/runbook/db-pool-saturation.md
      to: sysadmin

# Channel circuit breaker stuck open (ChannelBreakerStuckOpen, ticket). Labelled
# per channel_id → one alarm per channel; fires on the channel whose breaker is open.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches prometheus.newhub.lurus_gateway_circuit_breaker_state.
# The series is declared and written (metrics.CircuitBreakerState, set from
# internal/adapter/handler/relay.go via metrics.RecordCircuitBreakerState), so
# this is not a code defect this repo's oracle can detect — no channel's
# breaker has tripped Open since the go.d job started scraping. To manually
# disable a misbehaving channel: PUT /api/v2/{tenant_slug}/channels/{id} with
# status=2 (common.ChannelStatusManuallyDisabled).
# runbook: doc/runbook/channel-breaker-open.md
# series: lurus_gateway_circuit_breaker_state
template: newhub_channel_breaker_open
      on: prometheus.newhub.lurus_gateway_circuit_breaker_state
   class: Errors
    type: System
component: newhub
  lookup: max -30m
   units: state
   every: 1m
    warn: $this >= 1
   delay: down 30m
    info: a relay channel breaker has been open ≥30m — confirm upstream provider healthy or disable the channel (alarm names the channel_id)
      to: sysadmin

# Billing outbox backlog (BillingOutboxBacklog, ticket). Settlement-retry queue
# growing — platform slow or a dequeue bug.
# runbook: doc/runbook/billing-outbox-backlog.md
# series: lurus_billing_outbox_pending
template: newhub_billing_outbox_backlog
      on: prometheus.newhub.lurus_billing_outbox_pending
   class: Utilization
    type: System
component: newhub
  lookup: max -5m
   units: items
   every: 1m
    warn: $this > 100
   delay: down 15m
    info: billing outbox depth >100 — settlement-retry queue growing; platform slow or dequeue bug
      to: sysadmin

# Hub 5xx absolute floor (substitutes HubAvailabilityBelowSLO/Critical). The
# source rules are availability RATIOS (1 - 5xx/total); Netdata `lookup` can't
# divide cross-series rates, so this is the portable absolute-rate half. `5*`
# simple pattern matches status 500/502/503/504. One alarm per 5xx code.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): bound and
# CLEAR, but ONLY to the path=/api/health status=503 chart — this alarm
# watches health-check 503s, not general relay 5xx traffic (lurus_gateway_
# requests_total counts every HTTP request, console included; the relay
# path apparently has not produced a matching 5*-labelled chart yet). Do not
# read a WARNING here as "the relay is failing" without also checking
# newhub_upstream_5xx_burst below.
# runbook: doc/runbook/relay-5xx-elevated.md
# series: lurus_gateway_requests_total
template: newhub_relay_5xx_elevated
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=5*
   class: Errors
    type: Web Server
component: newhub
  lookup: average -5m
   units: req/s
   every: 1m
    warn: $this > 0.05
   delay: down 10m
    info: newhub relay sustained 5xx (bound to path=/api/health only as of 2026-09-15 — see comment above) — upstream provider health / channel selection; availability-ratio SLO not portable to Netdata (see NOT ported)
      to: sysadmin
# ⚠VERIFY: `status=5*` relies on netdata simple-pattern matching of the chart
# label value (same as platform_http_5xx_elevated). Fall back to per-code if not.

# Cost-spike 429 burst (CostSpikeBurstHigh, ticket) — many users hitting the
# 5-min quota guard at once.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches status=429 on this series. The underlying
# series is declared and written for every HTTP status including 429
# (internal/pkg/metrics/middleware.go's generic per-request recorder), so
# this is not a code defect this repo's oracle can detect — production has
# not returned a 429 since the go.d job started scraping (near-zero
# chargeable traffic).
# runbook: doc/runbook/cost-spike-429.md
# series: lurus_gateway_requests_total
template: newhub_cost_spike_429
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=429
   class: Workload
    type: Web Server
component: newhub
  lookup: average -5m
   units: req/s
   every: 1m
    warn: $this > 1
   delay: down 5m
    info: cost-spike 429s >1/s — multiple users hitting the 5-min quota guard simultaneously
      to: sysadmin

# Quota-cap 402 burst (QuotaCapBurstHigh, info) — many users at MaxQuota.
#
# LIVE STATUS (operator-verified on the R6 host, 2026-09-15): UNBOUND — no
# netdata chart currently matches status=402 on this series, for the same
# reason as newhub_cost_spike_429 above (series is written for any status
# code; production has not returned a 402 since the go.d job started
# scraping).
# runbook: doc/runbook/quota-cap-402.md
# series: lurus_gateway_requests_total
template: newhub_quota_cap_402
      on: prometheus.newhub.lurus_gateway_requests_total
chart labels: status=402
   class: Workload
    type: Web Server
component: newhub
  lookup: average -10m
   units: req/s
   every: 1m
    warn: $this > 5
   delay: down 10m
    info: 402 quota-capped >5/s — many users at MaxQuota (likely billing day); investigate if accelerating
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# PROVOKABLE ON DEMAND (cycle 9 first batch) — each can be driven live via the
# UAT fault simulator or a bounded Redis interruption and proved CLEAR ->
# WARNING -> CLEAR in the netdata alarm API; see the linked runbook's
# "Provoking this alarm on demand" section for the exact recipe.
#
# SCRAPE TOPOLOGY (applies to every alarm in this section): the go.d
# `prometheus` job scrapes ONE NodePort (http://localhost:30850/metrics) that
# round-robins across 3 replicas (deploy/k8s/r6-stage/deployment.yaml
# replicas: 3) at update_every = 10s. A counter's rate-converted dimension is
# therefore a per-replica sample, not a gateway-wide rate: consecutive
# scrapes can land on different replicas, so a real burst confined to one
# replica can be invisible on the scrapes that land elsewhere, and switching
# between two replicas with very different lifetime totals can produce a
# spurious delta. `lookup: average -Nm` on the rate-converted dimension is
# used throughout (never `sum`, which only equals an event count if the
# collection interval were 1s — it is 10s here). Thresholds below are
# first-cut and NOT calibrated against live data; the operator records the
# measured rate during the UAT probe and revises them then.
#
# UAT->PROD THRESHOLD TRANSLATION (cycle 13 L10): UAT (deploy/k8s/r6-uat/)
# runs 1 replica; prod runs 3 (same NodePort round-robin caveat above, just
# with a denominator of 1 instead of 3). A rate an operator measures by
# provoking an alarm on UAT is a single-replica rate — dividing a
# UAT-measured threshold by 3 before applying it to a PROD alarm over-warns
# in the direction of "still catches the same absolute event rate", not
# under-warns; multiplying a PROD-observed rate by 3 before comparing it
# against a UAT drill has the same relationship in reverse. This applies to
# every rate-based (`lookup: average`) alarm in this file, not only this
# section — it is recorded once here because this is where the topology is
# explained, not because the alarms added after this section are exempt.
# ════════════════════════════════════════════════════════════════════════════

# Upstream 5xx burst (an upstream provider failing with 5xx, distinct from
# newhub_relay_5xx_elevated above which is bound to health-check 503s only).
# error_type=upstream_5xx is types.RelayErrorType's fail-safe bucket:
# explicit 5xx, a failed transport-level request, or channel-capacity
# exhaustion with no status — internal/pkg/types/error.go.
# runbook: doc/runbook/upstream-5xx-burst.md
# series: lurus_gateway_relay_errors_total
alarm: newhub_upstream_5xx_burst
      on: prometheus.newhub.lurus_gateway_relay_errors_total
chart labels: error_type=upstream_5xx
   class: Errors
    type: Web Server
component: newhub
  lookup: average -5m
   units: errors/s
   every: 30s
    warn: $this > 0.02
    crit: $this > 0.1
   delay: down 10m
    info: lurus_gateway_relay_errors_total{error_type="upstream_5xx"} rate rising — an upstream provider is failing with 5xx; threshold not yet calibrated against live traffic (see file header). Runbook: doc/runbook/upstream-5xx-burst.md
      to: sysadmin

# Rate-limit fail-open degradation — a rate limiter's Redis backend call
# failed. The `check` label splits three different events:
#   1. fail-open ADMISSIONS — the request went through without being checked:
#      model_rate_limit_success, model_rate_limit_total, web_rate_limit_backend,
#      web_rate_limit_corrupt. THIS alarm covers exactly these.
#   2. a lost SUCCESS recording that is not a fail-open at all:
#      model_rate_limit_record — the request had already succeeded; only the
#      recording was lost. Also covered here; the info text says so rather
#      than pretending the aggregate rate can tell them apart.
#   3. an ENFORCED degradation: web_rate_limit_backend_memory (cycle-12 L4) —
#      a credential/abuse bucket fell back to the process-local limiter, so
#      the request WAS measured and callers can legitimately see 429s. That
#      one is excluded below and has its own lower-severity block.
# web_rate_limit_backend/_corrupt (cycle-11 L2) cover the
# rateLimitFactory/keyedRateLimitFactory callers in
# internal/adapter/middleware, not just the two k8s probe routes — see
# internal/pkg/metrics/r6_rate_limit_degraded.go and
# doc/runbook/rate-limit-degraded.md.
#
# GATE GAP, do not "tidy" this away (cycle-12 W): the repo's own conf parser,
# netdataChartLabelsLineRe in internal/pkg/metrics/netdata_alarm_series_test.go,
# is `^\s*chart labels:\s*(\S+)\s*$` — a single non-space token. The negative
# simple pattern below needs netdata's trailing " *" ("everything else"), so
# the line does not match that regex and TestNetdataAlarmsChartLabelKeysAreDeclared
# silently validates NO label key for this block. It does not go red; it
# measures nothing here. The sibling block's positive filter below IS parsed
# and does pin `check` as a declared label key of
# lurus_gateway_rate_limit_degraded_total, so the key itself is still gated —
# just from the other side. Widening the regex is a gate change and belongs to
# whoever owns that file, not to this conf.
# runbook: doc/runbook/rate-limit-degraded.md
# series: lurus_gateway_rate_limit_degraded_total
alarm: newhub_rate_limit_degraded
      on: prometheus.newhub.lurus_gateway_rate_limit_degraded_total
chart labels: check=!web_rate_limit_backend_memory *
# ⚠VERIFY (cycle-13 L10, 2026-09-20): the GATE GAP note above only says the
# REPO'S static test cannot see this line's label key — it does NOT say
# whether netdata's own simple-pattern engine actually excludes
# check=web_rate_limit_backend_memory here on the live host. Nobody has
# provoked both the excluded and the non-excluded check values live and
# confirmed only the latter moves this chart. Pending live verification;
# do not blindly "fix" the `!` syntax without first confirming on R6 that
# it is broken — it may already work exactly as written.
   class: Errors
    type: System
component: newhub
  lookup: average -5m
   units: events/s
   every: 30s
    warn: $this > 0
    crit: $this > 0.2
   delay: down 10m
    info: rate_limit_degraded_total rate rising — a rate limiter's Redis call failed: either a fail-open admission or a lost success recording; read the check label on /metrics before acting (see runbook). Runbook: doc/runbook/rate-limit-degraded.md
      to: sysadmin

# Rate-limit memory fallback (cycle-12 L4) — the same Redis failure, on a
# credential/abuse bucket (redemption, bootstrap, TOTP backup codes,
# channel-key reveal / TOTP disable, topup, the internal-API pre-auth IP
# tier). NOT a fail-open: the request was measured against the process-local
# limiter, so the ceiling is per replica (3 x budget cluster-wide) instead of
# cluster-wide. Warn only, no crit: the protection held. A 429 on
# redeem/login-bootstrap/2FA while this is climbing is expected behaviour,
# not a second incident.
# runbook: doc/runbook/rate-limit-degraded.md
# series: lurus_gateway_rate_limit_degraded_total
alarm: newhub_rate_limit_memory_fallback
      on: prometheus.newhub.lurus_gateway_rate_limit_degraded_total
chart labels: check=web_rate_limit_backend_memory
   class: Errors
    type: System
component: newhub
  lookup: average -5m
   units: events/s
   every: 30s
    warn: $this > 0
   delay: down 10m
    info: a credential/abuse rate-limit bucket is running on the process-local limiter because Redis is failing — still enforcing, but per replica; treat as a Redis incident, not as a limiter bug. Runbook: doc/runbook/rate-limit-degraded.md
      to: sysadmin

# Failover suppressed surge — upstream dropped a request mid-stream and a
# retry was deliberately withheld to avoid corrupting an already-started
# client response (FailoverSuppressedTotal, internal/pkg/metrics/metrics.go).
# A demand signal, not a routing error: relay_failover_total structurally
# cannot show these (the request never reaches a second channel).
# runbook: doc/runbook/failover-suppressed-surge.md
# series: lurus_gateway_relay_failover_suppressed_total
alarm: newhub_failover_suppressed_surge
      on: prometheus.newhub.lurus_gateway_relay_failover_suppressed_total
   class: Workload
    type: Web Server
component: newhub
  lookup: average -5m
   units: events/s
   every: 30s
    warn: $this > 0.01
    crit: $this > 0.05
   delay: down 10m
    info: relay_failover_suppressed_total rate rising — upstreams dropping requests mid-stream, retries withheld to protect an already-started client response. Runbook: doc/runbook/failover-suppressed-surge.md
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# MONEY PATH — cycle 13 L10 additions (crit/warn → email+webhook / webhook,
# same `to: sysadmin` convention as the MONEY PATH section above; these are
# money-conservation/revenue-integrity signals, not availability signals,
# so they are grouped separately from the original MONEY PATH block rather
# than merged into it).
# ════════════════════════════════════════════════════════════════════════════

# Credit-pool debit lost to a hard DB error, not exhaustion.
# CreditPoolDebitLostTotal (internal/pkg/metrics/metrics.go) counts
# post-consume pool debits that failed with a hard database error — pool
# EXHAUSTION is a different, non-alarmed-here series
# (CreditPoolOverdraftTotal: recorded and repaid by the next topup); a lost
# debit is NOT recorded anywhere and is a genuine conservation-law
# violation needing manual reconciliation. The metric's own doc comment
# says "alert on any increase" — this alarm is what makes that true.
# runbook: doc/runbook/wallet-revert-stranded.md
# series: lurus_gateway_credit_pool_debit_lost_total
template: newhub_credit_pool_debit_lost
      on: prometheus.newhub.lurus_gateway_credit_pool_debit_lost_total
   class: Errors
    type: System
component: newhub
  lookup: average -15m
   units: events/s
   every: 1m
    crit: $this > 0
   delay: down 15m
    info: a post-consume credit-pool debit failed with a hard DB error and was NOT recorded on any ledger — a real conservation-law violation; reconcile manually against the request's other ledgers (users.quota, tokens.remain_quota, whichever wallet charge landed). Runbook: doc/runbook/wallet-revert-stranded.md
      to: sysadmin

# Credit-pool debit skipped — pool row lookup failed (reason=lookup_error
# only; reason=no_pool is a legitimately un-pooled tenant or a separate
# tenant-id drift signal, not alarmed here — see the metric's own doc
# comment). CreditPoolLookupMissTotal{reason=lookup_error} counts
# post-consume debits that never reached the debit step because a hard DB
# error left the tenant's pool row unresolved — pool-gating state unknown,
# debit skipped. The metric's own doc comment says "Alert on any increase"
# for this reason; before this change nothing was bound to it.
# runbook: doc/runbook/wallet-revert-stranded.md
# series: lurus_gateway_credit_pool_lookup_miss_total
template: newhub_credit_pool_lookup_miss
      on: prometheus.newhub.lurus_gateway_credit_pool_lookup_miss_total
chart labels: reason=lookup_error
   class: Errors
    type: System
component: newhub
  lookup: average -15m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: a post-consume credit-pool debit was skipped because a hard DB error left the tenant's pool row unresolved (chart label pins reason=lookup_error, excludes the usually-benign no_pool reason) — pool-gating state is unknown for that tenant until this clears. Runbook: doc/runbook/wallet-revert-stranded.md
      to: sysadmin

# Shadow local-ledger write lost under LOCAL_LEDGER_ADVISORY.
# BillingAdvisoryMeterLost (internal/pkg/metrics/billing.go) counts
# shadow-ledger writes (user_quota / token_quota, see the chart's write
# label) that failed while LOCAL_LEDGER_ADVISORY is on — the platform
# wallet is the ledger of record and the request/settle proceeded
# normally, but the LOCAL mirror lost this data point, so the daily drift
# reconciliation between newhub's local numbers and the platform wallet
# will show a gap it cannot explain on its own without this signal.
# runbook: doc/runbook/settlement-failed.md
# series: lurus_billing_advisory_meter_lost_total
template: newhub_billing_advisory_meter_lost
      on: prometheus.newhub.lurus_billing_advisory_meter_lost_total
   class: Errors
    type: System
component: newhub
  lookup: average -30m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: a shadow local-ledger write was lost under LOCAL_LEDGER_ADVISORY (platform wallet still settled correctly) — the daily drift reconciliation will show an unexplained gap for this write (chart label). Runbook: doc/runbook/settlement-failed.md
      to: sysadmin

# Wallet charge rounds to 0.0000 under the platform wallet's numeric(14,4)
# column. BillingZeroAmountChargeTotal counts settlements where a STRICTLY
# POSITIVE local quota amount converts to a wallet charge under 0.00005
# LB — the column truncates that to 0.0000, so the customer keeps what
# they used for free. Pure observation (metrics.go: "a leak DETECTOR, not
# a fix") — the wallet-side precision fix itself is tracked separately.
# runbook: doc/runbook/settlement-failed.md
# series: lurus_billing_zero_amount_charge_total
template: newhub_billing_zero_amount_charge
      on: prometheus.newhub.lurus_billing_zero_amount_charge_total
   class: Utilization
    type: System
component: newhub
  lookup: average -30m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: a positive-quota wallet settlement rounded to 0.0000 under numeric(14,4) — the customer used real quota for a charge that landed as free (leak DETECTOR — the precision fix is tracked separately, out of this cycle's scope). Runbook: doc/runbook/settlement-failed.md
      to: sysadmin

# Stranded credit-pool topups still open — doc/runbook/wallet-revert-stranded.md
# already describes this in full (wallet debited, pool credit AND revert
# both failed; two automatic paths usually close it within one reconcile
# sweep, default 5m); this file had no alarm bound to the gauge that
# runbook already tells operators to read. Escalation threshold matches
# the runbook's own "Escalate" section verbatim (>0 for ~3 sweep
# intervals). Series name has NO lurus_/gateway_ prefix — see
# reconcile.go's own doc comment for why (cross-service naming, keyed by
# platform-side reconciliation dashboards).
# runbook: doc/runbook/wallet-revert-stranded.md
# series: newhub_credit_pool_stranded_open
template: newhub_credit_pool_stranded_open
      on: prometheus.newhub.newhub_credit_pool_stranded_open
   class: Errors
    type: System
component: newhub
  lookup: min -15m
   units: events
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: stranded credit-pool topup(s) have been open for 15+ minutes (~3 reconcile sweeps) — read doc/runbook/wallet-revert-stranded.md Detect/Reconcile before any manual DB write; most stranded events self-heal within one sweep and never reach this threshold. Runbook: doc/runbook/wallet-revert-stranded.md
      to: sysadmin

# Upstream provider account balance insufficient — distinct from newhub's
# own tenant credit-pool/quota 402s. error_type=upstream_insufficient_balance
# is types.RelayErrorType's bucket for a 402 from the provider itself, or a
# provider-specific "insufficient_quota"/"billing_not_active"/"Arrearage"
# error code (internal/pkg/types/error.go). The CHANNEL's upstream account
# ran out of money — every request on it keeps failing until the channel's
# owner tops it up; not a transient burst like newhub_upstream_5xx_burst.
# Not hypothetical: UAT's DeepSeek account balance was already negative as
# of 2026-09-03 (cycle-13 plan §1.1), and prod's single active route is the
# same provider.
# runbook: doc/runbook/upstream-5xx-burst.md
# series: lurus_gateway_relay_errors_total
template: newhub_upstream_insufficient_balance
      on: prometheus.newhub.lurus_gateway_relay_errors_total
chart labels: error_type=upstream_insufficient_balance
   class: Errors
    type: Web Server
component: newhub
  lookup: average -10m
   units: errors/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: an upstream provider is returning "insufficient balance" (its own account ran dry, not newhub's tenant quota/credit-pool) — every request on that channel (chart's provider/model labels) keeps failing until its owner tops up the upstream account. Runbook: doc/runbook/upstream-5xx-burst.md (general upstream-error triage — this error class is not 5xx-specific)
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# CHANNEL AUTO-BAN — cycle 13 L10 additions (warning → webhook; automatic
# channel-status changes made with no operator action, previously visible
# only by reading ChannelAutoStatusTotal directly or noticing a channel's
# status flipped).
# ════════════════════════════════════════════════════════════════════════════

# ChannelAutoStatusTotal{action} (internal/pkg/metrics/channel_probe.go)
# counts every status change the automatic probe pass makes; all four
# action values are pre-registered at 0 at boot (channel_probe.go init()),
# so an absent chart means no scrape has landed yet, not that this build
# doesn't wire the guard. doc/runbook/channel-auto-ban.md covers tuning
# ChannelDisableThreshold / AutoTestChannelEnabled before assuming either
# rate below is wrong rather than a real upstream problem.
# runbook: doc/runbook/channel-auto-ban.md
# series: lurus_gateway_channel_auto_status_total
template: newhub_channel_auto_disabled_error
      on: prometheus.newhub.lurus_gateway_channel_auto_status_total
chart labels: action=disable_error
   class: Errors
    type: Web Server
component: newhub
  lookup: average -30m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: the automatic probe pass disabled a channel after a hard error (not a latency breach) — check whether the upstream provider is actually down before assuming a flapping threshold. Runbook: doc/runbook/channel-auto-ban.md
      to: sysadmin

# runbook: doc/runbook/channel-auto-ban.md
# series: lurus_gateway_channel_auto_status_total
template: newhub_channel_auto_disabled_latency
      on: prometheus.newhub.lurus_gateway_channel_auto_status_total
chart labels: action=disable_latency
   class: Latency
    type: Web Server
component: newhub
  lookup: average -30m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: the automatic probe pass disabled a channel for breaching ChannelDisableThreshold on three consecutive probes — a real latency problem upstream, or the threshold needs recalibrating for this provider. Runbook: doc/runbook/channel-auto-ban.md
      to: sysadmin

# Sole-channel latency-ban hysteresis guard held: the automatic pass WOULD
# have disabled this channel for a third consecutive latency breach, but
# it is the only enabled channel serving at least one (group, model) pair
# it owns, so the guard left it enabled instead (handler.evaluateProbeOutcome,
# repo.SoleEnabledModelsForChannel) — a climbing rate means real users are
# getting slow responses from a channel that would normally have been
# taken out of rotation, with NO failover for whatever it exclusively
# serves.
# runbook: doc/runbook/channel-auto-ban.md
# series: lurus_gateway_channel_auto_status_total
template: newhub_channel_sole_latency_ban_skipped
      on: prometheus.newhub.lurus_gateway_channel_auto_status_total
chart labels: action=latency_ban_skipped_sole_channel
   class: Latency
    type: Web Server
component: newhub
  lookup: average -30m
   units: events/s
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: a channel that would normally have been auto-disabled for latency was left enabled because it is the sole channel serving one of its (group, model) pairs — add a backup channel for that model, or accept this model has no latency-ban failover today. Runbook: doc/runbook/channel-auto-ban.md
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# OPERATIONS / RELIABILITY — cycle 13 L10 additions.
# ════════════════════════════════════════════════════════════════════════════

# Metrics scrape staleness — the go.d prometheus job
# (http://localhost:30850/metrics) has stopped getting fresh data from
# whichever replica answered its last scrape. lurus_gateway_instance_info
# is a constant-1 "info" gauge (metrics.SetInstanceInfo, set once at boot
# before /metrics is mounted) — its VALUE never changes, so this alarm
# cannot key off $this directly; it uses netdata's own last-collected-time
# bookkeeping instead ($last_collected_t). This is the ONE alarm in this
# file that would still fire if every OTHER alarm below silently stopped
# evaluating, because a scrape target that stops answering takes every
# other lurus_gateway_*/lurus_billing_* alarm down with it — netdata
# cannot warn on a chart it has stopped receiving samples for.
# runbook: doc/runbook/metrics-scrape-stale.md
# series: lurus_gateway_instance_info
alarm: newhub_metrics_scrape_stale
      on: prometheus.newhub.lurus_gateway_instance_info
   class: Errors
    type: System
component: newhub
    calc: $now - $last_collected_t
   units: seconds
   every: 30s
    warn: $this > 60
    crit: $this > 300
   delay: down 5m
    info: newhub's /metrics endpoint has not been scraped successfully in over a minute (crit at 5) — every OTHER alarm in this file depends on this scrape succeeding and goes silently stale along with it. Runbook: doc/runbook/metrics-scrape-stale.md
      to: sysadmin

# Leader-gated background task stalled. lurus_gateway_leader_task_age_seconds{task}
# (internal/pkg/metrics/instance.go) is a companion-refreshed derivative of
# the existing last-success timestamp gauge — see its Go doc comment for
# the refresh mechanism and its two honest limits (absent until SOME
# registered task's first success in this process; a per-PROCESS reading
# that freezes rather than climbs on a replica that has been demoted from
# leader for a leader-only task).
#
# THRESHOLD IS DELIBERATELY LOOSE, first cut: registered task intervals
# span 30s (OpenRouter pool reaper) to 24h (secret-rotation, session-sweep,
# audit-cleanup, and cycle-13 L6's log-retention default) — a single flat
# threshold tight enough to catch the 30s task stalling would leave the
# four 24h tasks permanently WARN for most of every day (see this file's
# own "a permanently-WARNING alarm is worth exactly as much as one that
# never changes state", newhub_db_slow_queries above), which is worse than
# under-covering the fast ones. This alarm instead uses 3x the SLOWEST
# registered interval (3x24h = 72h) so it never falsely fires on a healthy
# slow task; a genuinely stalled FAST task will not trip this for up to
# 72h — GET /api/v2/admin/system/tasks (per-pod, root-only) is the faster,
# per-task-interval-aware signal for those until a future cycle splits
# this into per-task thresholds.
# runbook: doc/runbook/ha-deployment.md
# series: lurus_gateway_leader_task_age_seconds
alarm: newhub_task_stalled
      on: prometheus.newhub.lurus_gateway_leader_task_age_seconds
   class: Errors
    type: System
component: newhub
  lookup: average -15m
   units: seconds
   every: 5m
    warn: $this > 259200
   delay: down 15m
    info: a leader-gated background task (chart label names it) has not stamped a successful pass in 72h+ — task stuck, crash-looping, or lease flapping on whichever replica currently holds leadership; cross-check GET /api/v2/admin/system/tasks before paging (threshold deliberately loose across a 30s-24h interval spread — see comment above). Runbook: doc/runbook/ha-deployment.md
      to: sysadmin

# Schema migrations pending. SchemaMigrationsPending
# (internal/pkg/metrics/migrations.go) is the count of embedded migrations
# whose DDL is not yet recorded as applied, published once at boot
# (SetSchemaMigrations). The metric file's own doc comment already calls
# "> 0" the condition to page on; this alarm is what makes that true
# instead of only true in prose. MIGRATIONS_AUTO_RUN=false, or a replica
# set with no master-capable pod, are the two ways this goes nonzero and
# stays there — either way the pod is serving traffic against an older
# schema than the image it is running.
# runbook: doc/runbook/ha-deployment.md
# series: lurus_gateway_schema_migrations_pending
alarm: newhub_schema_migrations_pending
      on: prometheus.newhub.lurus_gateway_schema_migrations_pending
   class: Errors
    type: Database
component: newhub
  lookup: min -15m
   units: migrations
   every: 1m
    warn: $this > 0
   delay: down 15m
    info: this replica booted (or has stayed) with pending, unapplied schema migrations for 15+ minutes — check MIGRATIONS_AUTO_RUN and whether any replica is master-capable; /api/health's checks.schema_migrations carries the same signal per pod. Runbook: doc/runbook/ha-deployment.md
      to: sysadmin

# Panic caught by a recovery boundary. PanicsRecovered
# (internal/pkg/metrics/panic.go) counts panics a recover() caught (relay
# middleware / HTTP recovery / background goroutine — see the chart's
# source label), previously visible only in logs. The metric's own doc
# comment says a provider adapter panicking in a loop "should page, not
# sit silent behind a recover()" — this alarm is what makes that true.
# runbook: doc/runbook/incident-response.md
# series: lurus_gateway_panics_recovered_total
alarm: newhub_panics_recovered
      on: prometheus.newhub.lurus_gateway_panics_recovered_total
   class: Errors
    type: System
component: newhub
  lookup: average -30m
   units: panics/s
   every: 1m
    crit: $this > 0
   delay: down 15m
    info: a panic was caught by a recovery boundary (chart's source label) — recover() kept the process alive, but something is crashing in a loop; read logs for the panic's stack trace before it happens again. Runbook: doc/runbook/incident-response.md
      to: sysadmin

# Log-retention task backlog. lurus_gateway_log_retention_pending_rows{table}
# is declared here (L10) for cycle-13 L6's log-retention task
# (internal/lifecycle/log_retention.go, not yet landed as of this alarm —
# see the metric's own Go doc comment) to set each pass to the row count
# still past the retention cutoff after that pass's per-batch cap — nonzero
# for more than one interval means the task cannot keep up with deletion
# volume at its current LOG_RETENTION_BATCH / LOG_RETENTION_MAX_BATCHES_PER_PASS
# settings, or LOG_RETENTION_DAYS is 0 (retention off) and this is not
# expected to move at all.
# runbook: doc/runbook/log-retention.md
# series: lurus_gateway_log_retention_pending_rows
template: newhub_log_retention_backlog
      on: prometheus.newhub.lurus_gateway_log_retention_pending_rows
   class: Utilization
    type: Database
component: newhub
  lookup: max -30m
   units: rows
   every: 5m
    warn: $this > 0
   delay: down 30m
    info: the log-retention task's most recent pass still had rows past its cutoff when it hit its per-pass batch cap (chart label names the table) — raise LOG_RETENTION_MAX_BATCHES_PER_PASS/LOG_RETENTION_BATCH, or this is expected the first time retention is turned on against a large backlog. Runbook: doc/runbook/log-retention.md
      to: sysadmin


# ════════════════════════════════════════════════════════════════════════════
# NOT ported (Netdata-can't / coarser — README "Honest gaps")
# ════════════════════════════════════════════════════════════════════════════
#  • HubAvailabilityBelowSLO / HubAvailabilityCritical — (1 - 5xx/total)*100 SLO
#    ratios; Netdata `lookup` can't divide two cross-series rates. Substituted by
#    newhub_relay_5xx_elevated (absolute floor).
#  • HubP95LatencyHigh / HubGatewayOverheadHigh — histogram_quantile(0.95, ...);
#    Netdata has no quantile-over-buckets.
#  • ChannelBreakerFlapping — changes(state[10m])>5; Netdata `lookup` has no
#    state-transition count. The stuck-open alarm covers the worse failure mode.
