# Single-node Docker Compose for a 32-core / 32GB host.
# Stack: lurus-api + PostgreSQL 15 + Redis 7. Auth is delegated to an external
# OIDC provider (e.g. https://identity.lurus.cn). No HTTPS terminator — expose IP:3000.
#
# Usage:
#   1. cp .env.example .env  &&  fill it in
#   2. ./build.sh            # builds the lurus-hub:local image from local source
#   3. docker compose up -d
#   4. open http://<server-ip>:3000

name: lurus-hub

services:
  lurus-api:
    image: lurus-hub:local
    container_name: lurus-api
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - lurus_data:/data
      - lurus_logs:/app/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      SQL_DSN: "postgresql://lurus:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lurus_hub}?sslmode=disable"
      REDIS_CONN_STRING: "redis://redis:6379"

      SESSION_SECRET: ${SESSION_SECRET}
      # Empty by default — single-node deploys via IP/custom domain need a
      # host-only cookie. lurus.cn deploys override to ".lurus.cn" for SSO.
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"

      # OIDC — points at the configured provider (deploy-time, owner-gated).
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_FALLBACK_TO_LEGACY: ${OIDC_FALLBACK_TO_LEGACY:-true}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT}
      OIDC_INTROSPECTION_ENDPOINT: ${OIDC_INTROSPECTION_ENDPOINT}
      OIDC_DEFAULT_ORG_ID: ${OIDC_DEFAULT_ORG_ID}
      OIDC_DEFAULT_ORG_NAME: ${OIDC_DEFAULT_ORG_NAME:-Lurus Platform}
      OIDC_DEFAULT_ORG_DOMAIN: ${OIDC_DEFAULT_ORG_DOMAIN:-lurus}
      OIDC_OAUTH_SCOPES: ${OIDC_OAUTH_SCOPES:-openid email profile offline_access}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [lurus-net]
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 1G

  postgres:
    # Custom image = postgres:15 + wal-g for continuous WAL archiving.
    # wal-g settings (WALG_*, AWS_*) are provided via .env; PG's archive_command
    # invokes wal-g on every WAL segment.
    build:
      context: .
      dockerfile: Dockerfile.postgres-walg
    image: lurus-postgres:walg-15
    container_name: lurus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lurus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lurus_hub}
      TZ: ${TZ:-Asia/Shanghai}

      # ── wal-g target (S3-compatible: MinIO / Aliyun OSS / AWS S3) ──
      # Backups + WAL segments are written under WALG_S3_PREFIX.
      # For R6 stage: typically AWS_ENDPOINT=http://minio:9000 (in-cluster MinIO)
      # or http://10.0.0.1:9000 (host-network MinIO).
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-}
      AWS_ENDPOINT: ${WALG_AWS_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${WALG_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${WALG_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${WALG_AWS_REGION:-us-east-1}
      AWS_S3_FORCE_PATH_STYLE: "true"
      WALG_COMPRESSION_METHOD: ${WALG_COMPRESSION_METHOD:-lz4}
      # When WALG_S3_PREFIX is empty, archive-wal.sh no-ops so PG keeps running.
      # Restore drill (scripts/pg-restore-drill.sh) skips when target is unset.
    volumes:
      - pg_data:/var/lib/postgresql/data
    # PG tuned for 12 GB RAM, 6 logical CPUs, SSD storage.
    # archive_mode/archive_command: wal-g pushes each completed WAL segment.
    # archive_timeout=60: force a WAL switch every 60s so RPO ≤ 1 minute even
    # under low write traffic.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=9GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=6
      - -c
      - max_parallel_workers=6
      - -c
      - max_parallel_workers_per_gather=3
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # archive-wal.sh (baked into image) gracefully no-ops when WALG_S3_PREFIX
      # is empty, so a fresh deploy boots before backups are provisioned.
      # Once env is filled in + container restarts, real archiving kicks in.
      - archive_command=/usr/local/bin/archive-wal.sh %p
      - -c
      - archive_timeout=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lurus -d ${POSTGRES_DB:-lurus_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [lurus-net]
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 12G
        reservations:
          cpus: "1"
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: lurus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1500mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [lurus-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 256M

networks:
  lurus-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  lurus_data:
  lurus_logs:
