# Lurus newhub PROD (R6) — hub.lurus.cn → NodePort 30850
# 2026-05-19: hub.lurus.cn cutover from placeholder IngressRoute to host
# nginx vhost (R6 has no Traefik / ingress controller; all *.lurus.cn
# vhosts terminate TLS here and proxy to k8s NodePorts).
#
# Deployed at /etc/nginx/sites-available/lurus-newhub, symlinked into
# sites-enabled. Apply with: nginx -t && systemctl reload nginx.
#
# 2026-08-25: captured into this repo from the live file. A second, older
# copy exists at 2l-svc-platform/deploy/r6-host/nginx/lurus-newhub.conf; it
# has drifted and is NOT what is running — among other things it tells the
# operator the node is 43.226.38.244, while R6 (cloud-ubuntu-5-32c32g, the
# host both hub.lurus.cn and test-newhub.lurus.cn resolve to) is
# 43.226.45.87. This service's edge config belongs with the service, next
# to test-newhub.conf — treat that copy as stale.
server {
    listen 443 ssl http2;
    server_name hub.lurus.cn;
    client_max_body_size 64M;

    ssl_certificate     /etc/ssl/lurus-cn/tls.crt;
    ssl_certificate_key /etc/ssl/lurus-cn/tls.key;

    # See test-newhub.conf for the full rationale and the measurements:
    # /metrics exposes per-tenant credit-pool balances and was readable from
    # the public internet, because the in-process guard only inspected
    # RemoteAddr, which behind this proxy is always private. The one
    # legitimate scraper (obs-netdata go.d job "newhub") targets
    # http://localhost:30850/metrics directly and is unaffected by this.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:30850;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 600;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name hub.lurus.cn;
    return 301 https://$host$request_uri;
}
