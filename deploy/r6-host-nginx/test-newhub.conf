# Lurus newhub STAGE (R6) — test-newhub.lurus.cn → NodePort 30850
server {
    listen 443 ssl http2;
    server_name test-newhub.lurus.cn;
    client_max_body_size 64M;

    ssl_certificate     /etc/ssl/lurus-cn/tls.crt;
    ssl_certificate_key /etc/ssl/lurus-cn/tls.key;

    # /metrics is Prometheus exposition that carries tenant-level business
    # data — lurus_gateway_credit_pool_balance{tenant_id="..."} is a live
    # account balance. It was readable from the public internet here: the
    # last unblocked fetch is in /var/log/nginx/access.log as
    # `GET /metrics HTTP/2.0" 200 34299` (2026-08-25 15:15 +0800), and the
    # same exposition read from the node carries 248 lurus_* series. The
    # in-process guard only inspected RemoteAddr, which behind this reverse
    # proxy is always a private cluster address, so it admitted every
    # relayed request. (nginx logs all vhosts to one `combined`-format file
    # with no $host, so the older public 200s in there can't be attributed
    # to this vhost specifically — this block is not waiting on that.)
    #
    # Nothing scrapes /metrics through this vhost. The one consumer is the
    # obs-netdata container's go.d prometheus collector, job "newhub" in
    # /data/obs-pack/runtime/netdata/config/go.d/prometheus.conf, which
    # targets http://localhost:30850/metrics directly and was confirmed
    # still collecting after this block went in.
    #
    # 404 rather than 403 so the endpoint's existence isn't confirmed to a
    # scanner. This is the edge half of the fix; metricsAuthMiddleware in
    # internal/adapter/handler/router/main.go closes the same hole in the
    # pod, so a future vhost that forgets this block is not exposed.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:30850;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 600;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name test-newhub.lurus.cn;
    return 301 https://$host$request_uri;
}
