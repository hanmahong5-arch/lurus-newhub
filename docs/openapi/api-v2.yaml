  /api/v2/{tenant_slug}/invites/redeem:
    post:
      tags:
      - Tenant Admin
      summary: Redeem Tenant Invite
      description: Applies an invite's role and project grant to the already logged-in caller. Only a code of the caller's own tenant redeems; a foreign or unknown code is indistinguishable (404 INVITE_NOT_FOUND) and a foreign code is not consumed. Expired and revoked codes answer 410, a spent code 409.
      operationId: redeemTenantInviteV2
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code: &id006
                  type: string
      responses:
        '200':
          description: Redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tenant_id: *id006
                      member_role: *id006
                      project_id: *id007
        '400':
          description: code is required (INVITE_CODE_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: INVITE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: INVITE_ALREADY_CONSUMED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: INVITE_EXPIRED or INVITE_REVOKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
