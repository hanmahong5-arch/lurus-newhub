                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *id004
        '403': *id005
        '404':
          description: INVITE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/{tenant_slug}/members/{user_id}/role:
    put:
      tags:
      - Tenant Admin
      summary: Set Member Role
      description: Sets a member's tenant role (admin, dept_lead or empty) in the caller's own tenant. Tenant admin only. Refuses to leave the tenant without an admin (409 LAST_TENANT_ADMIN). The payer flag is root-only and ignored here. Not available in the shared default tenant.
      operationId: setTenantMemberRoleV2
      security: *id001
      parameters:
      - *id002
      - name: user_id
        in: path
        required: true
        schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleSet'
      responses:
        '200':
          description: Role set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: TENANT_ROLE_INVALID or missing tenant_role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id004
        '403': *id005
        '404':
          description: User is not a member of this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: LAST_TENANT_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/{tenant_slug}/audit:
    get:
      tags:
      - Tenant Admin
      summary: List Tenant Audit Events
      description: The tenant's own audit trail, newest first. Every query is pinned to the caller's tenant; a tenant_id query parameter is ignored. Details are redacted (channel ids, upstream keys, internal notes). Tenant admin only.
      operationId: listTenantAuditV2
      security: *id001
      parameters:
      - *id002
      - &id010
        name: action
        in: query
        description: Audit action name; unknown names are 400
        schema: *id006
      - &id011
        name: actor_id
        in: query
        schema: *id003
      - &id012
        name: start_time
        in: query
        description: Unix seconds, inclusive
        schema: *id007
      - &id013
        name: end_time
        in: query
        description: Unix seconds
        schema: *id007
      - *id008
      - *id009
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantAuditEvent'
                      total: *id007
                      page: *id003
                      page_size: *id003
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *id004
        '403': *id005
  /api/v2/{tenant_slug}/audit/export.csv:
    get:
      tags:
      - Tenant Admin
      summary: Export Tenant Audit Events (CSV)
      description: CSV export of the tenant's audit trail, one page per call. When more rows remain the response carries X-Next-Cursor; pass it back as cursor. Same filters, scoping and redaction as the list. Tenant admin only; rate limited.
      operationId: exportTenantAuditCSVV2
      security: *id001
      parameters:
      - *id002
      - *id010
      - *id011
      - *id012
      - *id013
      - name: cursor
        in: query
        description: Value of the previous X-Next-Cursor
        schema: *id007
      - name: limit
        in: query
        schema:
          type: integer
          default: 1000
      responses:
        '200':
          description: CSV page
          headers:
            X-Next-Cursor:
              description: Present when more rows remain
              schema: *id006
          content:
            text/csv:
              schema: *id006
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': *id004
        '403': *id005
        '429':
          description: Rate limited
          headers:
            Retry-After:
              description: Seconds until the next attempt
              schema: *id003
            X-RateLimit-Limit:
              description: Requests allowed per window
              schema: *id003
            X-RateLimit-Remaining:
              description: 0 on a reject
              schema: *id003
            X-RateLimit-Scope:
              description: Which limiter rejected the request
              schema: *id006
            X-RateLimit-Type:
              description: Limiter kind
              schema: *id006
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/{tenant_slug}/models/allowlist:
    get:
      tags:
      - Tenant Admin
      summary: Get Tenant Model Allow-list
      description: Shows the platform-granted model ceiling, the tenant's own narrowing selection and the effective list. Tenant admin only.
      operationId: getTenantModelAllowlistV2
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Allow-list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantModelAllowlist'
        '401': *id004
        '403': *id005
    put:
      tags:
      - Tenant Admin
      summary: Set Tenant Model Allow-list
      description: Narrows the models the tenant may use. Every entry must be covered by the platform ceiling when one is configured (403 MODEL_NOT_GRANTED); an empty list is an explicit deny-all; selected_models is required. The change reaches every replica within propagation_seconds. Tenant admin only; audited.
      operationId: putTenantModelAllowlistV2
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - selected_models
              properties:
                selected_models:
                  type: array
                  items: *id006
                  description: Model names or trailing-* patterns
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantModelAllowlist'
        '400':
          description: selected_models missing or an invalid entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a tenant admin, or MODEL_NOT_GRANTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/admin/tenants/{id}/members/{user_id}/role:
    put:
      tags:
      - Platform Admin
      summary: Set Tenant Member Role (root)
      description: Root bootstrap of a tenant's first admin or payer. The user must belong to the addressed tenant (404 otherwise). Same body and error codes as the tenant route, plus the optional payer flag.
      operationId: setTenantMemberRoleAdmin
      security:
      - SessionAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Tenant id
        schema: *id006
      - name: user_id
        in: path
        required: true
        schema: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleSet'
      responses:
        '200':
          description: Role set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: TENANT_ROLE_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: LAST_TENANT_ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    OIDCBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token issued by the deployment's configured OIDC provider.
        Which provider that is, is deploy-time configuration; no specific
        vendor is part of this contract.
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie for platform admin

  parameters:
    TenantSlug:
      name: tenant_slug
      in: path
      required: true
      description: >-
        Tenant identifier (slug). On routes behind TenantSlugGuard the
        reserved value `~` means "the tenant this session authenticated into";
        the server resolves it from the session, and it is what the console
        sends. An explicit slug must equal that tenant (403 TENANT_MISMATCH
        otherwise). `GET /user/me` reports the real slug as `tenant_slug`.
      schema:
        type: string
        pattern: '^([a-z0-9-]+|~)$'
        example: lurus
    Page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ChannelId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TokenId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ChatSessionId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Invalid request"

    SessionInfo:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: integer
        tenant_id:
          type: string
        tenant_slug:
          type: string
        tenant_role:
          type: string
          enum:
          - ''
          - admin
          - dept_lead
          description: The caller's tenant role; empty for plain members and in the shared default tenant
        is_payer:
          type: boolean
          description: True when the caller is the tenant's payer

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until expiration

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        display_name:
          type: string
        role:
          type: integer
        status:
          type: integer
        quota:
          type: integer
        used_quota:
          type: integer
        created_at:
          type: integer
          description: Unix timestamp

    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 50

    Channel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: integer
        base_url:
          type: string
        models:
          type: string
        status:
          type: integer
        priority:
          type: integer
        weight:
          type: integer

    ChannelCreate:
      type: object
      required: [name, type, key]
      properties:
        name:
          type: string
        type:
          type: integer
        key:
          type: string
        base_url:
          type: string
        models:
          type: string
        group:
          type: string
        priority:
          type: integer
          default: 0
        weight:
          type: integer
          default: 1

    ChannelUpdate:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        base_url:
          type: string
        models:
          type: string
        status:
          type: integer
        priority:
          type: integer
        weight:
          type: integer

    ChannelList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        total:
          type: integer

    Token:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key:
          type: string
          description: Masked key (sk-xxx...xxx)
        status:
          type: integer
        quota:
          type: integer
        used_quota:
          type: integer
        expired_time:
          type: integer
        created_at:
          type: integer

    TokenWithKey:
      allOf:
        - $ref: '#/components/schemas/Token'
        - type: object
          properties:
            full_key:
              type: string
              description: Full API key (only shown once)

    TokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        quota:
          type: integer
          minimum: 0
        expired_time:
          type: integer
          description: Unix timestamp, -1 for never

    TokenUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: integer
        quota:
          type: integer
        expired_time:
          type: integer

    TokenList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        total:
          type: integer

    TopUpList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              amount:
                type: number
              quota:
                type: integer
              status:
                type: string
              created_at:
                type: integer
        total:
          type: integer

    StatementRow:
      type: object
      properties:
        key: {type: string}
        label: {type: string}
        requests: {type: integer, format: int64}
        quota: {type: integer, format: int64}
        charged_cny4: {type: integer, format: int64}
        priced_cny4: {type: integer, format: int64}
    InvoiceMonth:
      type: object
      description: One calendar month of billable spend.
      properties:
        month:
          type: string
          description: YYYY-MM
        quota:
          type: integer
          format: int64
          description: Billable quota units consumed
        amount_cny:
          type: number
          description: "Amount charged for the month in CNY: the wallet charge recorded at settlement for each request that has one (logs.charged_cny4), the record-time price (logs.priced_cny4) for billable rows the wallet did not pay (credit-pool / local-quota spend), and only for rows that carry neither record the quota priced at the current exchange rate (QuotaPerUnit / USDExchangeRate quota per CNY). Changing the exchange rate re-prices only that last share; see estimated."
        estimated:
          type: boolean
          description: "True when part of amount_cny was priced at the current exchange rate because some billable row predates logs.priced_cny4 (migration 042); that part changes when the rate is edited. False means every row carries a recorded figure and the amount is final."
        request_count:
          type: integer
          format: int64
          description: Number of billable log rows
        unbilled_quota:
          type: integer
          format: int64
          description: >-
            Quota logged but excluded from billing (settlement-failed or
            channel-test rows)
        unbilled_request_count:
          type: integer
          format: int64
          description: Number of log rows excluded from billing

    LogList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              user_id:
                type: integer
              model:
                type: string
              prompt_tokens:
                type: integer
              completion_tokens:
                type: integer
              quota:
                type: integer
              created_at:
                type: integer
        total:
          type: integer

    Redemption:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        quota:
          type: integer
        count:
          type: integer
        used_count:
          type: integer
        status:
          type: integer
        created_at:
          type: integer

    RedemptionCreate:
      type: object
      required: [quota, count]
      properties:
        quota:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
          maximum: 100

    RedemptionList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
        total:
          type: integer

    Tenant:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        zitadel_org_id:
          type: string
        status:
          type: string
          enum: [active, disabled, suspended]
        created_at:
          type: integer

    TenantCreate:
      type: object
      required: [slug, name, zitadel_org_id]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
        name:
          type: string
        zitadel_org_id:
          type: string

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string

    TenantList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        total:
          type: integer

    TenantStats:
      type: object
      properties:
        user_count:
          type: integer
        token_count:
          type: integer
        channel_count:
          type: integer
        total_quota:
          type: integer
        used_quota:
          type: integer

    UserMapping:
      type: object
      properties:
        id:
          type: integer
        zitadel_user_id:
          type: string
        lurus_user_id:
          type: integer
        tenant_id:
          type: string
        created_at:
          type: integer

    UserMappingList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserMapping'
        total:
          type: integer

    SystemStats:
      type: object
      properties:
        tenant_count:
          type: integer
        total_users:
          type: integer
        total_requests:
          type: integer
        total_tokens:
          type: integer

    ModelCatalogEntry:
      type: object
      description: Whitelist projection of a catalogue model row.
      properties:
        id:
          type: integer
        model_name:
          type: string
        vendor:
          type: string
          description: Vendor display name, empty when unknown
        name_rule:
          type: integer
        status:
          type: integer
        quota_types:
          type: array
          items:
            type: integer
        enable_groups:
          type: array
          items:
            type: string
        endpoints:
          type: string
        created_time:
          type: integer
          format: int64

    BatchTokenItem:
      type: object
      required:
      - employee_ref
      properties:
        name:
          type: string
          description: Defaults to employee_ref
        employee_ref:
          type: string
          pattern: ^[A-Za-z0-9._@:-]{1,64}$
        project_id:
          type: integer
          minimum: 0
          description: 0 = no project
        remain_quota:
          type: integer
          minimum: 0
        unlimited_quota:
          type: boolean
        model_limits:
          type: string
          description: Comma separated model list; empty = no limit
    BatchTokenCreate:
      type: object
      required:
      - tokens
      properties:
        tokens:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/BatchTokenItem'
    BatchTokenResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
            properties:
              id: &id002
                type: integer
              name: &id001
                type: string
              employee_ref: *id001
              project_id: *id002
              key:
                type: string
                description: Plaintext key, returned only in this response
        skipped:
          type: array
          description: Employees that already had a live key; not re-issued
          items:
            type: object
            properties:
              employee_ref: *id001
              id: *id002
              name: *id001
        requested: *id002
    ProjectMember:
      type: object
      properties:
        user_id: *id002
        username: *id001
        display_name: *id001
        tenant_role: *id001
        added_at: &id003
          type: integer
          format: int64
    TenantInvite:
      type: object
      properties:
        id: *id002
        tenant_id: *id001
        code:
          type: string
          description: One-time onboarding code; the full value is returned only when the invite is created (list responses carry code_prefix)
        status:
          type: integer
          description: 1 pending, 2 consumed, 3 revoked
        expired_time:
          type: integer
          format: int64
          description: Unix seconds, 0 = never
        created_by_user_id: *id002
        consumed_by_account_id:
          type: integer
          format: int64
          nullable: true
        consumed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        member_role:
          type: string
          enum:
          - ''
          - admin
          - dept_lead
        project_id: *id003
        revoked_at: *id003
    TenantInviteView:
      type: object
      description: 'List projection: the code prefix only, never the full code'
      properties:
        id: *id002
        code_prefix: *id001
        status: *id002
        expired_time: *id003
        consumed_by_account_id:
          type: integer
          format: int64
          nullable: true
        consumed_at:
          type: string
          format: date-time
          nullable: true
        created_by_user_id: *id002
        created_at:
          type: string
          format: date-time
        member_role: *id001
        project_id: *id003
        expires_at: *id003
        revoked_at: *id003
        used:
          type: boolean
        revoked:
          type: boolean
        expired:
          type: boolean
    InviteCreate:
      type: object
      properties:
        ttl_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
        member_role:
          type: string
          enum:
          - ''
          - admin
          - dept_lead
        project_id:
          type: integer
          format: int64
          minimum: 0
    MemberRoleSet:
      type: object
      required:
      - tenant_role
      properties:
        tenant_role:
          type: string
          enum:
          - admin
          - dept_lead
          - ''
          description: Empty string = plain member
        payer:
          type: boolean
          description: 'Root route only: mark this user as the tenant payer (owner of admin-issued keys). Ignored on the tenant route.'
    TenantAuditEvent:
      type: object
      description: 'Tenant-safe projection of an audit event: no hash chain, details redacted (channel ids, upstream keys and internal notes are masked)'
      properties:
        id: *id003
        timestamp: *id003
        actor_type: *id001
        actor_id: *id002
        action: *id001
        resource: *id001
        resource_id: *id002
        ip: *id001
        request_id: *id001
        details: *id001
    TenantModelAllowlist:
      type: object
      properties:
        platform_allowed:
          type: array
          items: *id001
          description: Ceiling granted by the platform (names or trailing-* patterns)
        platform_unrestricted:
          type: boolean
          description: True when the platform configured no ceiling
        tenant_selected:
          type: array
          items: *id001
        tenant_configured:
          type: boolean
        effective:
          type: array
          items: *id001
        propagation_seconds:
          type: integer
          description: 'Present on PUT: upper bound before every replica serves the new list'
