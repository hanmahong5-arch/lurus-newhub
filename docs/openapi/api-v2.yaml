  /api/v2/{tenant_slug}/tokens/batch:
    post:
      tags:
      - Tokens
      summary: Batch Create Tokens (roster)
      description: 'Issues one key per employee of a roster. Tenant admin only. At most 500 items, all-or-nothing in one transaction. Idempotent per employee_ref: an employee that already has a live key is reported under skipped and not re-issued. The plaintext keys of newly created tokens appear in this response only. Keys are owned by the tenant payer (409 payer_not_set when none is configured) and are never trusted-gateway keys.'
      operationId: batchCreateTokensV2
      security: &id001
      - OIDCBearer: []
      parameters:
      - &id002
        $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTokenCreate'
      responses:
        '201':
          description: Keys created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BatchTokenResult'
        '200':
          description: Every employee already had a key; nothing created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BatchTokenResult'
        '400':
          description: Invalid item (error_code TOKEN_BATCH_INVALID) or too many items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Tenant admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: employee_ref conflict, or the tenant has no payer (error_code payer_not_set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/{tenant_slug}/projects/{id}/members:
    get:
      tags:
      - Projects
      summary: List Project Members
      description: Lists the members (department leads) of a project. Tenant admin only; a project of another tenant is 404.
      operationId: listProjectMembersV2
      security: *id001
      parameters:
      - *id002
      - name: id
        in: path
        required: true
        schema: &id003
