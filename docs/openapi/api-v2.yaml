openapi: 3.0.3
info:
  title: Lurus API V2 - Multi-Tenant Gateway
  description: |
    Lurus API V2 provides multi-tenant access to LLM API gateway services.

    ## Authentication

    V2 authenticates through OpenID Connect. Which provider, which issuer and
    which client id are deploy-time configuration, not part of this contract:
    the console redirects to whatever provider the deployment was given.

    1. Redirect the user to `GET /api/v2/{tenant_slug}/auth/login`
    2. The user authenticates with the deployment's configured OIDC provider
    3. The provider calls back to `GET /api/v2/oauth/callback`
    4. Later requests carry the session cookie, or a bearer token for the
       machine callers that hold one (`OIDCBearer` below)

    ## Tenant Isolation

    All tenant-specific endpoints are scoped by `{tenant_slug}` in the URL path.
    Users can only access data within their assigned tenant.

    ## Rate Limiting

    - Every route below `/api/v2` sits behind one shared bucket: 600 requests
      per 180 s per source IP (`middleware.GlobalV2RateLimit`,
      api-v2-router.go). It is keyed by the client address, NOT by account or
      session, so everybody behind one NAT or CGNAT egress address spends the
      same budget - an office on a single public address shares one bucket.
    - Those numbers are the shipped defaults. An operator retunes them with
      `GLOBAL_V2_RATE_LIMIT` and `GLOBAL_V2_RATE_LIMIT_DURATION`, so the limit
      a given deployment enforces may differ.
    - A limit of 0 DISABLES the bucket; it does not mean unlimited. To turn the
      limiter off deliberately, set `GLOBAL_V2_RATE_LIMIT_ENABLE=false`.
    - A reject is `429` with `Retry-After`, `X-RateLimit-Limit`,
      `X-RateLimit-Remaining`, `X-RateLimit-Scope: ip`,
      `X-RateLimit-Type: requests`, and an empty body.
    - Individual routes may add a narrower bucket of their own on top of this
      one - see the 429 on `POST /api/v2/{tenant_slug}/redeem`.
    - Relay traffic is metered by quota, not by this bucket.

  version: 2.0.0
  contact:
    name: Lurus Support
    email: support@lurus.cn
  license:
    name: Proprietary
    url: https://lurus.cn/terms

servers:
  - url: https://hub.lurus.cn
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: OAuth
    description: OAuth 2.0 / OpenID Connect authentication flows
  - name: User
    description: User profile management
  - name: Channels
    description: LLM provider channel management
  - name: Tokens
    description: API token management
  - name: ChatSessions
    description: Console chat sessions (client-driven persistence)
  - name: Billing
    description: 'Invoice and top-up history. Read-only: this spec documents no route that moves money.'
  - name: Logs
    description: Usage logs
  - name: Redemptions
    description: Redemption codes
  - name: Platform Admin
    description: Platform-level administration
  - name: Projects
    description: Cost-attribution projects and their members
  - name: Tenant Admin
    description: 'Tenant-admin self-service: invites, member roles, audit trail and model allow-list'

paths:
  # ============================================================
  # OAuth Authentication Routes
  # ============================================================

  /api/v2/{tenant_slug}/auth/login:
    get:
      tags: [OAuth]
      summary: Initiate OAuth Login
      description: |
        Redirects to the configured OIDC provider's login page. A PKCE challenge is sent only when OIDC_ENABLE_PKCE=true, which is off by default.
        After successful authentication, user is redirected to callback URL.
      operationId: zitadelLoginRedirect
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: redirect_url
          in: query
          description: URL to redirect after successful login
          schema:
            type: string
            example: /console
      responses:
        '302':
          description: Redirect to the OIDC provider's login page
          headers:
            Location:
              description: Authorization URL at the configured OIDC provider
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Tenant not found

  /api/v2/oauth/callback:
    get:
      tags: [OAuth]
      summary: OAuth Callback
      description: |
        Handles the OAuth callback from the configured OIDC provider.
        Exchanges authorization code for tokens and creates session.
      operationId: zitadelCallback
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code issued by the OIDC provider
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter for CSRF protection
          schema:
            type: string
      responses:
        '302':
          description: Redirect to original URL with session established
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/auth/session-info:
    get:
      tags: [OAuth]
      summary: Get Session Info
      description: Returns current user session data for frontend
      operationId: getSessionInfo
      responses:
        '200':
          description: Session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/oauth/logout:
    post:
      tags: [OAuth]
      summary: Logout
      description: Logs out at the OIDC provider and clears the session
      operationId: zitadelLogout
      responses:
        '200':
          description: Successfully logged out
        '302':
          description: Redirect to the OIDC provider's logout URL

  # ============================================================
  # User Routes
  # ============================================================

  /api/v2/{tenant_slug}/user/me:
    get:
      tags: [User]
      summary: Get Current User
      description: Returns the current authenticated user's profile
      operationId: getSelfV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: Update Current User
      description: Updates the current user's profile
      operationId: updateSelfV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Channel Routes
  # ============================================================

  /api/v2/{tenant_slug}/channels:
    get:
      tags: [Channels]
      summary: List Channels
      description: Lists all available LLM provider channels
      operationId: listChannelsV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          description: Search keyword
          schema:
            type: string
      responses:
        '200':
          description: List of channels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Channels]
      summary: Create Channel
      description: Creates a new LLM provider channel (Admin only)
      operationId: createChannelV2
      security:
        - OIDCBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelCreate'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/{tenant_slug}/channels/{id}:
    get:
      tags: [Channels]
      summary: Get Channel
      description: Gets a specific channel by ID
      operationId: getChannelV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '200':
          description: Channel details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Channels]
      summary: Update Channel
      description: Updates a channel (Admin only)
      operationId: updateChannelV2
      security:
        - OIDCBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpdate'
      responses:
        '200':
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Channels]
      summary: Delete Channel
      description: Deletes a channel (Admin only)
      operationId: deleteChannelV2
      security:
        - OIDCBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChannelId'
      responses:
        '204':
          description: Channel deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Token Routes
  # ============================================================

  /api/v2/{tenant_slug}/tokens:
    get:
      tags: [Tokens]
      summary: List Tokens
      description: Lists all API tokens for the current user
      operationId: listTokensV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tokens]
      summary: Create Token
      description: Creates a new API token
      operationId: createTokenV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Token created (includes full key, only shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenWithKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/{tenant_slug}/tokens/{id}:
    put:
      tags: [Tokens]
      summary: Update Token
      description: Updates an API token
      operationId: updateTokenV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TokenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenUpdate'
      responses:
        '200':
          description: Token updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tokens]
      summary: Delete Token
      description: Deletes an API token
      operationId: deleteTokenV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: Token deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Chat Session Routes (migration 038, cycle-10 L3; 400 error codes and
  # the model field added cycle-11 L5)
  # ============================================================

  /api/v2/{tenant_slug}/chat/sessions:
    get:
      tags: [ChatSessions]
      summary: List Chat Sessions
      description: Lists the caller's own saved chat sessions, most-recently-updated first.
      operationId: listChatSessionsV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Chat sessions listed
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ChatSessions]
      summary: Create Chat Session
      description: >-
        Saves a conversation the client already holds — the request carries
        the full turn array, not a single new turn to append.
      operationId: createChatSessionV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Chat session created
        '400':
          description: >-
            Bad request — error_code is CHAT_SESSION_LIMIT_REACHED (the
            caller already owns 200 sessions in this tenant) or
            INVALID_REQUEST (oversized/invalid title, model, or messages).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/{tenant_slug}/chat/sessions/{id}:
    get:
      tags: [ChatSessions]
      summary: Get Chat Session
      description: Fetches one saved chat session (plus its messages) the caller owns.
      operationId: getChatSessionV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChatSessionId'
      responses:
        '200':
          description: Chat session fetched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ChatSessions]
      summary: Update Chat Session
      description: >-
        Partially updates title and/or model, and/or REPLACES the full
        message list, of a chat session the caller owns.
      operationId: updateChatSessionV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChatSessionId'
      responses:
        '200':
          description: Chat session updated
        '400':
          description: >-
            Bad request — error_code is INVALID_REQUEST (oversized/invalid
            title, model, or messages). A rejected update leaves the stored
            session unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ChatSessions]
      summary: Delete Chat Session
      description: Deletes a chat session (and its messages) the caller owns.
      operationId: deleteChatSessionV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ChatSessionId'
      responses:
        '200':
          description: Chat session deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Billing Routes
  # ============================================================

  /api/v2/{tenant_slug}/billing/invoices:
    get:
      tags: [Billing]
      summary: List Monthly Invoices
      description: |
        Monthly spend buckets for the calling user inside this tenant. Both
        query parameters are optional; the range is always clamped to at most
        12 calendar months. There is deliberately no amount_usd field - no FX
        source is wired into this endpoint.
      operationId: listInvoicesV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: from
          in: query
          description: First month, YYYY-MM
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
        - name: to
          in: query
          description: Last month, YYYY-MM
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        '200':
          description: Monthly spend buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceMonth'
                      total_invoices:
                        type: integer
                      summary:
                        type: object
                        properties:
                          total_quota:
                            type: integer
                            format: int64
                          total_cny:
                            type: number
                          mtd_quota:
                            type: integer
                            format: int64
                            description: >-
                              Billable quota in the current UTC calendar month
        '400':
          description: Invalid from/to range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Invoice aggregation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/{tenant_slug}/billing/statement:
    get:
      tags: [Billing]
      summary: Monthly Statement
      description: |
        Tenant monthly statement grouped by project, employee, token or model. The
        month is a calendar month in the requested time zone. Tenant admins
        see the whole tenant; department leads see only their own projects
        (the unassigned project 0 bucket is hidden). format=csv exports the same
        statement for the whole tenant. Totals are exactly the
        sum of the rows. Amounts are in 0.0001 CNY.
      operationId: getBillingStatementV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: month
          in: query
          description: 'Calendar month, YYYY-MM (default is the current month in tz)'
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
        - name: tz
          in: query
          description: IANA time zone
          schema:
            type: string
            default: Asia/Shanghai
        - name: group_by
          in: query
          schema:
            type: string
            enum: [project, employee, token, model]
            default: project
        - name: format
          in: query
          description: csv returns a text/csv download of the whole tenant statement (same grouping, month and totals row)
          schema:
            type: string
            enum: [csv]
      responses:
        '200':
          description: Statement rows and totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      month:
                        type: string
                      tz:
                        type: string
                      group_by:
                        type: string
                      start:
                        type: integer
                        format: int64
                      end:
                        type: integer
                        format: int64
                      rows:
                        type: array
                        items:
                          $ref: '#/components/schemas/StatementRow'
                      totals:
                        $ref: '#/components/schemas/StatementRow'
            text/csv:
              schema:
                type: string
        '400':
          description: Invalid month, tz or group_by
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Neither tenant admin nor department lead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Statement aggregation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/{tenant_slug}/billing/topups:
    get:
      tags: [Billing]
      summary: List Top-ups
      description: Lists user's top-up history
      operationId: getTopUpsV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Top-up history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # Log Routes
  # ============================================================

  /api/v2/{tenant_slug}/logs:
    get:
      tags: [Logs]
      summary: Get User Logs
      description: Gets usage logs for the current user
      operationId: getLogsV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: model
          in: query
          description: Filter by model name
          schema:
            type: string
        - name: start_time
          in: query
          description: Start time (Unix timestamp)
          schema:
            type: integer
        - name: end_time
          in: query
          description: End time (Unix timestamp)
          schema:
            type: integer
      responses:
        '200':
          description: Usage logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/{tenant_slug}/logs/all:
    get:
      tags: [Logs]
      summary: Get All Logs
      description: Gets all users' logs (Admin only)
      operationId: getAllLogsV2
      security:
        - OIDCBearer: [admin]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: user_id
          in: query
          description: Filter by user ID
          schema:
            type: integer
      responses:
        '200':
          description: All logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # Redemption Routes
  # ============================================================

  /api/v2/{tenant_slug}/redeem:
    post:
      tags: [Redemptions]
      summary: Redeem Code
      description: |
        Redeems a redemption code and credits the quota to the calling user.
        Mounted at /api/v2/{tenant_slug}/redeem (api-v2-router.go), NOT under
        the /redemptions collection. Guarded by a 5-requests-per-60-seconds
        per-IP limiter because the code itself is the only credential.
      operationId: redeemCodeV2
      security:
        - OIDCBearer: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Send the 32-character code as either key or code; key wins when
                both are present.
              properties:
                key:
                  type: string
                  minLength: 32
                  maxLength: 32
                  description: Redemption code (v1-compatible field name)
                code:
                  type: string
                  minLength: 32
                  maxLength: 32
                  description: Redemption code (alias of key)
      responses:
        '200':
          description: Code redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      quota_added:
                        type: integer
                        description: Quota units credited
        '400':
          description: >-
            Missing or malformed code, or the code is unusable (expired,
            already used, unknown). Body carries success=false, message and
            error_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >-
            Redemption rate limit exceeded. middleware.RedemptionRateLimit
            (rate-limit.go) allows 5 attempts per 60 s per client IP in the RD
            bucket, because the code itself is the only credential and an
            unthrottled run is code guessing. The reject carries the headers
            below and an EMPTY body - the limiter writes a bare status, not a
            JSON envelope, so a client must branch on the status code, not on
            `success`. If Redis is unreachable this bucket degrades to a
            process-local limiter rather than failing open, which makes the
            effective ceiling (replicas x 5) per 60 s until Redis returns. The
            wider /api/v2 bucket described in info.description applies first.
          headers:
            Retry-After:
              description: Seconds until this IP's redemption window frees a slot.
              schema:
                type: integer
            X-RateLimit-Limit:
              description: Attempts allowed per window. 5 for this bucket.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Attempts left in the window. Always 0 on a reject.
              schema:
                type: integer
            X-RateLimit-Scope:
              description: What the bucket is keyed by. Always `ip` here.
              schema:
                type: string
                enum: [ip]
            X-RateLimit-Type:
              description: What is being counted. Always `requests` here.
              schema:
                type: string
                enum: [requests]
        '500':
          description: Hub-side redemption fault (error_code REDEMPTION_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

