name: Security Tests

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      # This workflow must be in its own trigger list, or a PR that touches
      # nothing but this file never runs the job it is editing — including an
      # edit that breaks or hollows it out. go-ci.yml already lists itself.
      - '.github/workflows/security-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/security-tests.yml'
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false

jobs:
  security-tests:
    name: Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The repo's go.mod has `replace` directives pointing at
      # ../shared/lurus-proto-go and ../shared/zita-sdk-go. `actions/checkout`
      # refuses paths outside GITHUB_WORKSPACE, so check the sibling repos
      # into the workspace then move them into the parent ../shared/ dir.
      - name: Check out lurus-proto-go (sibling dep)
        uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1

      - name: Check out zita-sdk-go (pinned sibling dep)
        uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1

      - name: Relocate sibling repos to ../shared
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling

      - name: Stub web/dist for //go:embed in web/embed.go
        # web/embed.go uses //go:embed dist; without a placeholder the
        # whole-module compile in `go test ./internal/...` may still trip
        # on transitive packages that import web.
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Security Tests
        run: |
          set -uo pipefail

          # ANTI-HOLLOW GUARD — do not remove.
          #
          # This whole job selects tests by name with -run. `go test -run <pat>`
          # exits 0 when the pattern matches NOTHING, so a single rename in any
          # of these suites silently turns this green while testing nothing.
          # Same failure class the pg-integration job guards with its
          # TestIntegrationPGHarness_RealPostgres sentinel.
          #
          # Each ALTERNATIVE inside a pattern is asserted separately, which is
          # the part that actually matters: "JWKS|Zitadel" would still match 22
          # tests via JWKS alone if every Zitadel test disappeared, so a
          # whole-pattern count cannot detect a half-dead selector.
          run_suite() {
            local pkgs="$1" pattern="$2" label="$3"
            local alt n total=0

            local old_ifs="$IFS"
            IFS='|'
            # shellcheck disable=SC2086 -- word-splitting on | is the point here
            set -- $pattern
            IFS="$old_ifs"

            for alt in "$@"; do
              n=$(go test $pkgs -list "$alt" 2>/dev/null | grep -c '^Test')
              if [ "$n" -eq 0 ]; then
                echo "::error::Security suite '${label}': -run alternative '${alt}' matches 0 tests."
                echo "  go test exits 0 on an empty match, so this job would have reported PASS"
                echo "  while running nothing for that category. A test was most likely renamed."
                echo "  Fix the pattern — do not delete this guard."
                exit 1
              fi
              echo "  ${alt}: ${n} tests"
              total=$((total + n))
            done

            echo "=== ${label}: ${total} tests matched, running ==="
            go test -v $pkgs -run "$pattern" -count=1 -timeout=5m || exit 1
          }

          echo "=== Running Security Test Suite ==="
          run_suite "./internal/adapter/..."            "Security"        "adapter security"
          run_suite "./internal/adapter/repo/..."       "Tenant"          "repo tenant isolation"
          run_suite "./internal/adapter/handler/..."    "Security"        "handler security"
          run_suite "./internal/adapter/middleware/..." "JWKS|Zitadel"    "middleware key rotation"

      - name: Run OAuth Security Tests
        run: |
          set -uo pipefail

          # Same anti-hollow guard as the step above; see the comment there.
          # This pattern has five alternatives, so it is the one most likely to
          # rot silently one name at a time.
          run_suite() {
            local pkgs="$1" pattern="$2" label="$3"
            local alt n total=0

            local old_ifs="$IFS"
            IFS='|'
            # shellcheck disable=SC2086 -- word-splitting on | is the point here
            set -- $pattern
            IFS="$old_ifs"

            for alt in "$@"; do
              n=$(go test $pkgs -list "$alt" 2>/dev/null | grep -c '^Test')
              if [ "$n" -eq 0 ]; then
                echo "::error::OAuth suite '${label}': -run alternative '${alt}' matches 0 tests."
                echo "  This job would have reported PASS while running nothing for that category."
                echo "  Fix the pattern — do not delete this guard."
                exit 1
              fi
              echo "  ${alt}: ${n} tests"
              total=$((total + n))
            done

            echo "=== ${label}: ${total} tests matched, running ==="
            go test -v $pkgs -run "$pattern" -count=1 || exit 1
          }

          echo "=== Running OAuth Security Tests ==="
          run_suite "./internal/adapter/handler/..." \
            "PKCE|IDToken|TenantSlug|RedirectURL|OAuthState" "oauth/pkce"

      - name: Summary
        if: always()
        run: |
          echo "## Security Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security regression tests completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Categories" >> $GITHUB_STEP_SUMMARY
          echo "- Tenant Isolation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- JWKS Key Rotation Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Rate Limiting Tests" >> $GITHUB_STEP_SUMMARY
          echo "- Input Sanitization Tests (SQL Injection, XSS)" >> $GITHUB_STEP_SUMMARY
          echo "- Auth Bypass Tests (JWT validation)" >> $GITHUB_STEP_SUMMARY
          echo "- OAuth/PKCE Security Tests" >> $GITHUB_STEP_SUMMARY
