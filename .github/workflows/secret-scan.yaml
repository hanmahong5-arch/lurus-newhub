# Secret scanning gate — blocks plaintext credentials from entering the repo.
#
# SCOPE NOTE (important, do not "fix" by switching to a full-history scan):
# this gate scans the *working tree* (`--no-git`), not git history. History
# rewriting is owner-gated, so a history scan would pin CI permanently red
# and teach people to ignore it. This gate's job is preventing the *next*
# leak. Known findings already present in the working tree are tracked in
# the rollout report, not silenced here.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans every file in the checkout. Exit code 1 == leaks found == gate fails.
      # --redact keeps the secret itself out of the CI log.
      - name: Scan working tree for plaintext secrets
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
