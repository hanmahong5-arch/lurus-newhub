# Secret scanning gate — blocks plaintext credentials from entering the repo.
#
# SCOPE NOTE (important, do not "fix" by switching to a full-history scan):
# this gate scans the *working tree* (`--no-git`), not git history. History
# rewriting is owner-gated, so a history scan would pin CI permanently red
# and teach people to ignore it. This gate's job is preventing the *next*
# leak. Known findings already present in the working tree are tracked in
# the rollout report, not silenced here.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # No sudo: the self-hosted pool is rootless with no real sudo (same
      # constraint as the playwright install in web-ci.yml), so `sudo install`
      # into /usr/local/bin failed this job before any scanning. Use a
      # gitleaks already on PATH, else download into a user-writable dir.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks version
            exit 0
          fi
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dl="$RUNNER_TEMP/gitleaks-dl"
          mkdir -p "$dl" "$RUNNER_TEMP/bin"
          curl -sSfL "$base/$tarball" -o "$dl/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$dl/checksums.txt"
          (cd "$dl" && awk -v f="$tarball" '$2 == f || $2 == "*" f' checksums.txt | sha256sum -c -)
          tar -xzf "$dl/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          chmod 0755 "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Scans every file in the checkout. Exit code 1 == leaks found == gate fails.
      # --redact keeps the secret itself out of the CI log.
      - name: Scan working tree for plaintext secrets
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
