name: Acceptance (real chain)

# The executable business acceptance suite (web/tests/acceptance) against a
# full local stack: PostgreSQL 16 + Redis + the real binary with its real
# migrations, r6-stage's environment, and cmd/fakeupstream standing in for
# the LLM vendors and the platform wallet. Every money assertion is exact and
# reconciled against an independent price list. See TESTING.md.
#
# scripts/acceptance-stack.sh does all of it, the same command a developer
# runs. It starts its own PostgreSQL and Redis containers on random ports
# rather than using job services: the self-hosted pool shares one network
# namespace between runners, so a fixed 5432 would collide.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'web/src/**'
      - 'web/tests/acceptance/**'
      - 'web/playwright.acceptance.config.ts'
      - 'web/scripts/acceptance-meta-gate*.mjs'
      - 'web/package.json'
      - 'web/bun.lock'
      - 'scripts/acceptance-stack.sh'
      - '.github/workflows/acceptance.yml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'web/src/**'
      - 'web/tests/acceptance/**'
      - 'web/playwright.acceptance.config.ts'
      - 'web/scripts/acceptance-meta-gate*.mjs'
      - 'web/package.json'
      - 'web/bun.lock'
      - 'scripts/acceptance-stack.sh'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  acceptance:
    name: real-chain acceptance (local stack)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Sibling modules for go.mod's replace directives, exactly as go-ci.yml.
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-entkit
          # pinned: bump deliberately after a kit release (2l-svc-platform pkg/entkit)
          ref: 90c81f1a9193a205a6b7c904686ae9dd238daefe
          path: _sibling/lurus-entkit
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          mv _sibling/lurus-entkit ../shared/lurus-entkit
          rmdir _sibling
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: ${{ !vars.CI_RUNS_ON }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install web dependencies and Chromium
        working-directory: web
        # No --with-deps on the self-hosted pool: it is rootless (see web-ci.yml).
        run: |
          bun install --frozen-lockfile
          bunx playwright install $([ "$RUNNER_ENVIRONMENT" = self-hosted ] || echo --with-deps) chromium
      - name: Meta-gate self-test
        working-directory: web
        run: bun scripts/acceptance-meta-gate.test.mjs
      - name: Build, start the stack, run the scenarios, apply the meta-gate
        run: bash scripts/acceptance-stack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: |
            web/acceptance-report/
            !web/acceptance-report/.state/
          retention-days: 14
