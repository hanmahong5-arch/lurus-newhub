name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright e2e against STAGE'
        required: false
        default: 'false'

defaults:
  run:
    working-directory: web

jobs:
  test:
    # Named for what the steps below actually run. It used to say
    # "Lint + Typecheck + Vitest" while running no typecheck at all — there is
    # no typecheck script and nothing to typecheck (web/ is plain JS, 421
    # .js/.jsx and zero .ts, and jsconfig.json does not enable checkJs). A
    # reviewer reading a green "Typecheck" was being told a check had run that
    # never existed. The Vite build job is what actually catches
    # module-resolution and import errors.
    name: Lint + Vitest + casing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run eslint
      - run: bun run test
      - name: snake_case casing gate
        run: bun run check:casing

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: bun audit + gitleaks
    runs-on: ubuntu-latest
    # Run security checks independently so they don't block the fast test job
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by gitleaks for commit-range scanning
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: bun audit (blocking — moderate acceptable, high+ blocks)
        # 2026-05-26 Wave-Phase H1 cleanup landed: bun audit went from
        # 87 vuln (1 crit, 26 high, 55 mod, 5 low) to 0 crit / 0 high / 7 mod / 0 low
        # via `overrides` block in web/package.json (minimist, lodash, js-cookie,
        # immutable, glob/minimatch/picomatch/brace-expansion, rollup, @remix-run/router,
        # protocol-buffers-schema, prismjs, yaml, geojson-flatten) + axios direct bump
        # 1.12.0 -> 1.16.1 (same major, non-breaking). Major bumps (react 19, vite 8,
        # tailwind 4, eslint 10, typescript 6, react-router 7, lucide-react 1.x,
        # @douyinfe/semi 2.99, marked 18, i18next 26) were deliberately deferred —
        # they break the build/eslint config and need their own focused stories.
        #
        # RATCHETED 2026-08-02: `--audit-level critical` -> `high`, which this
        # note has asked for since the H1 cleanup.
        #
        # Running it at `high` for the first time found 15 HIGH advisories that
        # `critical` had been passing silently. 14 were fixable inside the
        # current majors and are fixed in the same commit, via package.json
        # overrides (brace-expansion 5.0.9, postcss 8.5.25, undici 7.29.0,
        # flatted 3.4.4, js-yaml 4.3.1, form-data 4.0.6, immutable 5.1.5->5.1.9)
        # plus a same-major axios bump 1.16.1 -> 1.19.0.
        #
        # Scope, so nobody over- or under-reacts to this list later: every one of
        # the 15 reached the tree through a BUILD/DEV/TEST path (eslint, vitest,
        # jsdom, tailwind, sass, prettier, vite), not through the shipped bundle.
        # Even the two axios-family ones are in its Node HTTP adapter, which the
        # browser build does not use. The exposure was the build host and the
        # supply chain, not end users.
        #
        # The one exception below is GHSA-fx2h-pf6j-xcff (vite `server.fs.deny`
        # bypass on Windows alternate paths). It is NOT fixable in vite 5: the
        # 5.x line ends at 5.4.21 with no backport, and the fix starts at 6.4.3.
        # A vite 5 -> 6 major bump belongs in its own story with its own build
        # verification, exactly as the deferred-majors note above says. It is
        # also the least alarming item on the list — it affects `vite dev` only,
        # and production here is a Go binary serving the embedded web/dist, so
        # the dev server never runs in any deployed environment.
        #
        # Do NOT widen this to a blanket level change. One documented, scoped
        # exception is the point; going back to `critical` re-hides the other 14.
        #
        # CI is the measurement, deliberately: `bun audit` cannot run on the
        # Windows dev host (its endpoint 404s there), so this step is the only
        # place the real number is knowable.
        run: bun audit --audit-level high --ignore GHSA-fx2h-pf6j-xcff
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional; set it in repo secrets if you have a
          # commercial license. The action works without it for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  e2e:
    name: Playwright e2e (STAGE)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://test-newhub.lurus.cn' }}
          E2E_BRIDGE_TOKEN: ${{ secrets.E2E_BRIDGE_TOKEN }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG || 'default' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
