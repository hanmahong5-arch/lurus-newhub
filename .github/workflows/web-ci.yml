name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run Playwright e2e against UAT (test-newhub.lurus.cn)'
        required: false
        default: 'false'
  # Nightly e2e against the isolated UAT instance (test-newhub.lurus.cn →
  # NodePort 30851 since the 2026-08-30 cutover). 19:00 UTC = 03:00 Beijing:
  # off working hours and clear of auto-pin rollouts.
  schedule:
    - cron: '0 19 * * *'

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Lint + Typecheck + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run eslint
      # Runs the full vitest suite AND enforces the coverage ratchet declared in
      # web/vitest.config.js (`coverage.thresholds`). Vitest exits non-zero when a
      # threshold is breached, so a coverage regression fails the job. Replaces the
      # bare `bun run test` — same tests, plus the gate; running both would double
      # the suite for no extra signal.
      - run: bun run test:coverage
      - name: snake_case casing gate
        run: bun run check:casing

  build:
    name: Vite build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: bun audit + gitleaks
    runs-on: ubuntu-latest
    # Run security checks independently so they don't block the fast test job
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required by gitleaks for commit-range scanning
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - name: bun audit (blocking — high+ acceptable, critical blocks)
        # 2026-05-26 Wave-Phase H1 cleanup landed: bun audit went from
        # 87 vuln (1 crit, 26 high, 55 mod, 5 low) to 0 crit / 0 high / 7 mod / 0 low
        # via `overrides` block in web/package.json (minimist, lodash, js-cookie,
        # immutable, glob/minimatch/picomatch/brace-expansion, rollup, @remix-run/router,
        # protocol-buffers-schema, prismjs, yaml, geojson-flatten) + axios direct bump
        # 1.12.0 -> 1.16.1 (same major, non-breaking). Major bumps (react 19, vite 8,
        # tailwind 4, eslint 10, typescript 6, react-router 7, lucide-react 1.x,
        # @douyinfe/semi 2.99, marked 18, i18next 26) were deliberately deferred —
        # they break the build/eslint config and need their own focused stories.
        #
        # 2026-08-17: the "0 high / 7 moderate" line above was a 2026-05-26
        # snapshot and had gone badly stale — nothing watched it, because this
        # gate only blocks on `critical`. Re-measured on this lockfile against
        # the npmjs registry: 83 vulnerabilities (0 critical, 20 HIGH, 56
        # moderate, 7 low). Ten packages had drifted back in-range, several of
        # them pinned by the `overrides` block itself (immutable was pinned at
        # 5.1.5, which the new advisory covers).
        #
        # Overrides refreshed in the same change — all within-major, no build
        # break: immutable 5.1.5->5.1.9, @isaacs/brace-expansion 5.0.1->5.0.9,
        # axios 1.16.1->1.19.0 (direct dep), and new pins for undici 7.29.0,
        # form-data 4.0.6, flatted 3.4.4, js-yaml 4.3.1, nanoid 3.3.18,
        # postcss 8.5.26. Measured after: 45 vulnerabilities (0 critical,
        # 2 high, 38 moderate, 5 low) — 20 high -> 2.
        #
        # The 2 remaining highs are both GHSA-fx2h-pf6j-xcff (vite
        # `server.fs.deny` bypass, dev-server only, not in the shipped bundle).
        # Fixing it needs vite >6.4.2, i.e. the vite 5 -> 8 major bump that is
        # deliberately deferred above. So the gate stays at `critical`:
        # `--audit-level high` still exits 1 (verified), `--audit-level
        # critical` exits 0. Ratchet to `high` in the PR that lands the vite
        # major — re-run `bun audit` and see 0 high first, do not assume.
        #
        # A plain `brace-expansion` override was tried and reverted: it is not
        # needed once @isaacs/brace-expansion is current, and forcing 5.x onto
        # minimatch-1.x consumers is a risk with no payoff.
        run: bun audit --audit-level critical
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is optional; set it in repo secrets if you have a
          # commercial license. The action works without it for public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  e2e:
    name: Playwright e2e (UAT)
    runs-on: ubuntu-latest
    # Branch on event: schedule events carry NO inputs, so a naive
    # `inputs.run_e2e == 'true'` arm alone would never fire nightly.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      github.event_name == 'schedule'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://test-newhub.lurus.cn' }}
          E2E_BRIDGE_TOKEN: ${{ secrets.E2E_BRIDGE_TOKEN }}
          # 'lurus' matches the helper default (tests/e2e/helpers/auth.ts) that
          # every green local run used — the bridge's cosmetic "default" slug is
          # not routable, so a 'default' fallback here would fail in CI only.
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG || 'lurus' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
