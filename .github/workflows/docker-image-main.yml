name: Publish Docker image (main branch)

# 2026-08-11: absorbed the former separate "Build and Push Docker Image"
# workflow (build.yaml, now deleted). That workflow triggered on the same
# `push: branches:[main]` event and built the identical Dockerfile/context,
# and its `docker/metadata-action` config (`type=ref,event=branch`) produced
# the SAME `:main` tag this workflow already pushes — i.e. on every merge to
# main, two independent builds raced to push ghcr.io/…/lurus-newhub:main,
# and whichever finished last silently won (registry last-write-wins on a
# tag), so the digest the deploy runbook tells you to pin was
# non-deterministic based on build-runner scheduling. Its only non-duplicate
# value was the Trivy HIGH/CRITICAL vulnerability gate (on push AND on PR,
# pre-merge) — that gate is folded in below, now scanning the actual
# `:main`/`:main-<date>-<sha>` artifact instead of a throwaway look-alike
# build that was never the one actually deployed.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

jobs:
  build_and_push:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out lurus-proto-go
        uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: lurus-proto-go
          fetch-depth: 1

      - name: Check out zita-sdk-go (pinned, pre-alpha)
        uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          # Pre-alpha pin per release_cadence rule. Full sha required;
          # actions/checkout treats short shas as branch/tag names.
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: zita-sdk-go
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          VERSION="main-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version: $VERSION"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skip on PR: PRs don't push, so no registry credentials are needed
        # (and PRs from forks wouldn't have a usable GITHUB_TOKEN for pushing
        # anyway). Mirrors the guard the old build.yaml PR job used.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # On PRs: build only, load into the local daemon so Trivy can scan
          # it, don't push (no `:main`/version tag should ever be published
          # from unmerged code). push/load are mutually exclusive.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:main
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Scan image for HIGH/CRITICAL vulnerabilities (Trivy)
        # BLOCKING gate, absorbed from the deleted build.yaml. ignore-unfixed
        # drops CVEs with no upstream fix yet so the gate stays actionable.
        # Scans the exact tag just built above (pushed on push/dispatch,
        # locally loaded on PR) — i.e. the real artifact, not a parallel
        # throwaway build, so a red run here means the image that would
        # actually reach `:main` has a fixable HIGH/CRITICAL CVE.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
