name: Go CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.github/workflows/go-ci.yml'

jobs:
  build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `actions/checkout` refuses paths outside GITHUB_WORKSPACE, so check
      # the sibling repos into the workspace and relocate to ../shared to
      # satisfy the relative `replace` directives in go.mod.
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        # The Go binary embeds web/dist via //go:embed (see web/embed.go).
        # Production builds run `bun run build` to populate dist; for a
        # Go-only verify, a placeholder dist/index.html satisfies the embed
        # without paying the frontend build cost.
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go build ./...

  test-handler:
    name: handler audit + governance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `actions/checkout` refuses paths outside GITHUB_WORKSPACE, so check
      # the sibling repos into the workspace and relocate to ../shared to
      # satisfy the relative `replace` directives in go.mod.
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        # The Go binary embeds web/dist via //go:embed (see web/embed.go).
        # Production builds run `bun run build` to populate dist; for a
        # Go-only verify, a placeholder dist/index.html satisfies the embed
        # without paying the frontend build cost.
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      # Scoped run: covers the audit + governance + v2 token pagination paths
      # added/repaired in Lane D. Broader `go test -short ./...` is deferred
      # until baseline OAuth/JWKS test debt is cleaned —
      # see _bmad-output/planning-artifacts/test-debt-findings.md.
      - run: |
          go test -count=1 -short -v -timeout=5m \
            ./internal/adapter/handler/ \
            -run 'TestGetAuditEvents|TestGetGovernance|TestListTokensV2_Pagination'

  coverage-gate:
    name: coverage gate (app/repo/handler baselines)
    runs-on: ubuntu-latest
    # Thresholds are CURRENT BASELINE (re-ratcheted 2026-08-02) — not aspirational.
    # They prevent regression. Raise them in the same PR that lifts the underlying
    # coverage (ratchet upward, never downward), with a measured before/after in
    # the commit. Each check_pkg line carries the measured actual + its buffer.
    # See Wave-UAT ADR for why the plan's 80/60/50 targets aren't reachable in
    # hermetic tests today.
    #
    # A ratchet only protects the gap it actually covers. Before 2026-08-02 the
    # internal/app line still read 25 against a comment claiming "actual 27.0%"
    # from 2026-05-31 — but the package had measured 86.2% for months, so
    # coverage there could have collapsed by SIXTY-ONE points and this job would
    # still have printed PASS. That is the package holding the quota/billing
    # money path. All three numbers below are re-derived from CI's own output
    # (not a local run) so the buffer is honest about cross-platform drift.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check per-package coverage (statement-weighted)
        run: |
          set -e
          FAIL=0

          # check_pkg <pkg-path> <threshold> <label>
          # Runs `go test -coverprofile` for ONE package path, parses the
          # statement-weighted "total" from `go tool cover -func | tail -1`,
          # and fails if below threshold. Per-package isolation keeps each
          # number directly comparable to the manual `go test ... -cover`
          # output developers see locally.
          check_pkg() {
            local pkg_path="$1"
            local threshold="$2"
            local label="$3"
            local profile=/tmp/cov-${label//\//-}.out

            go test -short -timeout=120s -coverprofile="$profile" -covermode=atomic "./${pkg_path}/..." > /tmp/test-out.log 2>&1 || {
              echo "  TEST FAILED for ${label} — see log below"
              cat /tmp/test-out.log
              FAIL=1
              return
            }

            local pct
            pct=$(go tool cover -func="$profile" | tail -1 | awk '{ sub(/%$/, "", $NF); print $NF }')

            echo "${label}: ${pct}% (threshold: ${threshold}%)"
            if awk "BEGIN { exit (${pct}+0 >= ${threshold}+0) ? 0 : 1 }"; then
              echo "  PASS"
            else
              echo "  FAIL: ${label} ${pct}% < ${threshold}%  — increase test coverage or update baseline (with measurement)"
              FAIL=1
            fi
          }

          check_pkg "internal/app"             84 "internal/app"             # actual 86.2% on main (CI run 30152927620, 2026-07-25) and 86.2% on PR #67 (run 30447541676); 84 = 86.2-2.2pt buffer. Was 25 with a stale "actual 27.0%" comment — a 61pt hole over the money path.
          check_pkg "internal/adapter/repo"    62 "internal/adapter/repo"    # actual 63.8% on main (run 30152927620) / 64.3% on PR #67; 62 = 63.8-1.8pt buffer against the LOWER (main) figure. Was 59.
          check_pkg "internal/adapter/handler" 50 "internal/adapter/handler" # actual 52.6% on main (run 30152927620) and on PR #67; 50 = 52.6-2.6pt buffer. Kept wider than the other two because of the baseline OAuth/JWKS test debt noted on the handler-audit job. Was 48.

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Coverage gate FAILED. Either add tests OR adjust baseline in"
            echo "this file with a measured before/after in the commit message."
            exit 1
          fi

          echo ""
          echo "Coverage gate PASSED."

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `actions/checkout` refuses paths outside GITHUB_WORKSPACE, so check
      # the sibling repos into the workspace and relocate to ../shared to
      # satisfy the relative `replace` directives in go.mod.
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        # The Go binary embeds web/dist via //go:embed (see web/embed.go).
        # Production builds run `bun run build` to populate dist; for a
        # Go-only verify, a placeholder dist/index.html satisfies the embed
        # without paying the frontend build cost.
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go vet ./...

  gosec:
    name: gosec security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec (HIGH severity, MEDIUM+ confidence)
        # Scans only the main module dirs; excludes .claude worktrees (other agent branches).
        # All existing HIGH findings are suppressed with #nosec + justification comments.
        # New code must not introduce HIGH/CRITICAL severity issues.
        run: gosec -severity high -confidence medium -exclude-dir=.claude ./internal/... ./cmd/...

  lint:
    name: golangci-lint (gate new issues)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives only-new-issues the base commit to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: golangci-lint (curated linters; ratchet — gate only new findings)
        # Pre-existing findings across the module are a known baseline and are NOT
        # gated. The ratchet (a PR may not ADD findings) is enforced with
        # --new-from-rev=origin/main instead of the action's only-new-issues:
        # only-new-issues fetches the PR patch from the GitHub API, which 406s
        # once the PR diff exceeds 20k lines — the action then silently falls
        # back to whole-repo lint and reports the entire pre-existing baseline
        # (observed on PR #14). --new-from-rev diffs locally (fetch-depth: 0
        # above provides origin/main) with the same new-issues-only semantics.
        # Action v7 + golangci-lint v2 are required here — v1 (last release
        # v1.64.8) is built with go 1.24 and cannot load this module's go
        # 1.25.1 directive. Linter set + timeout live in root .golangci.yml.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --new-from-rev=origin/main ./internal/... ./cmd/...

  race:
    name: go test -race (short, hermetic)
    runs-on: ubuntu-latest
    # BLOCKING (re-blocked 2026-06-03). History: -race surfaced pre-existing data
    # races — PR #5 fixed 3 deterministic clusters and re-blocked; PR #7 reverted to
    # report-only after an intermittent slog cross-test race; PR #8 fixed that
    # (slogLogger is now atomic.Pointer; slogOnce gone). Re-block evidence (per the
    # "many consecutive green runs" arm of the criteria, not a single run — that was
    # the #5->#7 mistake): a -count=10 full-suite stress run found 0 DATA RACE
    # warnings across 10 iterations, plus repeated green -count=1 runs. The census's
    # remaining "wider surface" (repo.DB / RedisEnabled resets, hub/quota singletons)
    # proved theoretical under -race — e.g. GetUserCache's cache-refresh spawn is
    # gated by shouldUpdateRedis (RedisEnabled read on the caller's goroutine), so it
    # never fires when tests disable Redis. See the audit doc for the full evidence.
    # -race needs gcc (absent on the dev host) -> CI is the sole enforcer; if an
    # intermittent race resurfaces, capture the stack and fix it — do not silently
    # revert to report-only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      # -race needs CGO; ubuntu-latest ships gcc, so CGO_ENABLED defaults to 1.
      # -short keeps it to the hermetic suite (Postgres/MinIO integration tests
      # self-skip without their DSNs).
      - name: go test -short -race ./...
        run: go test -short -race -count=1 -timeout=15m ./...

  pg-integration:
    name: repo integration tests (disposable Postgres)
    runs-on: ubuntu-latest
    # The internal/adapter/repo integration tests (token / user-quota / tenant /
    # internal-api-key) reach the database through SetupTestDB, which t.Skip()s
    # when TEST_POSTGRES_DSN is unset — so before this job they NEVER ran in CI
    # and reported a hollow green (CLAUDE.md §4.1③). They cover money-path
    # invariants (quota debit/credit atomicity, token validate/expire/exhaust,
    # tenant-whitelist auth, daily-reset idempotency) that only mean anything
    # against a real PostgreSQL. This job stands one up as a disposable service,
    # points TEST_POSTGRES_DSN at it, and runs the suite. The
    # TestIntegrationPGHarness_RealPostgres sentinel + the grep step below keep
    # the gate from silently reverting to all-skip. BLOCKING: it must stay green;
    # a real money-path regression should fail `main`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Gate the test step on a ready server so the first CREATE DATABASE in
        # SetupTestDB does not race the container's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: _sibling/lurus-proto-go
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: _sibling/zita-sdk-go
          fetch-depth: 1
      - name: Relocate sibling repos to ../shared (matches go.mod replace paths)
        run: |
          mkdir -p ../shared
          mv _sibling/lurus-proto-go ../shared/lurus-proto-go
          mv _sibling/zita-sdk-go ../shared/zita-sdk-go
          rmdir _sibling
      - name: Stub web/dist for //go:embed in web/embed.go
        run: |
          mkdir -p web/dist
          echo '<!doctype html><title>stub</title>' > web/dist/index.html
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: go test repo + migration packages against Postgres
        # -short skips the !testing.Short() stress tests; the PG integration tests
        # gate on the DSN (not on -short), so they all run here. -v + tee lets the
        # next step assert the harness sentinel actually executed.
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -o pipefail
          go test -short -count=1 -timeout=15m -v ./internal/adapter/repo/... ./internal/pkg/migration/... 2>&1 | tee /tmp/pg-test.log
      - name: Assert the PG harness was not hollow (sentinel ran + passed)
        # Defends against a misconfigured DSN that would make SetupTestDB t.Skip
        # the whole suite into a vacuous green. The sentinel only PASSes when it
        # reached a live PostgreSQL; if it was skipped or absent, fail the job.
        run: |
          if grep -q -- '--- SKIP: TestIntegrationPGHarness_RealPostgres' /tmp/pg-test.log; then
            echo "::error::PG harness sentinel was SKIPPED — TEST_POSTGRES_DSN did not reach a live Postgres; the integration suite ran hollow."
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestIntegrationPGHarness_RealPostgres' /tmp/pg-test.log; then
            echo "::error::PG harness sentinel did not PASS — expected it to run against the disposable Postgres."
            exit 1
          fi
          echo "PG harness sentinel confirmed: integration suite ran against a live Postgres."
