name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Deployment reason"
        required: false
        default: "Manual deployment"

# NOTE: the `pull_request: types: [closed]` trigger that used to sit here was
# removed 2026-08-11. Every PR merge into main already produces a `push` event
# on main (GitHub creates the merge commit and pushes it), so the two triggers
# fired for the SAME commit at the SAME time on every merge. That made this
# workflow run "Build Staging Image" twice concurrently for one commit, and
# both copies raced to write the same default `type=gha` buildx cache scope —
# confirmed via `gh run view --log-failed` on 5/5 sampled failures, all
# pull_request-triggered, all: "buildx failed with: ERROR: failed to build:
# failed to solve: error writing layer blob: failed to reserve cache", each
# paired with a same-second push-triggered run of the identical commit that
# succeeded. Removing the redundant trigger removes the race by construction
# (one run per commit) without losing any coverage — direct pushes to main
# (no PR) were never covered by the removed trigger anyway.

# Prevent concurrent deployments
concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  # Build and push staging image
  build:
    name: Build Staging Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      image_tag: ${{ steps.version.outputs.value }}
      has_kubeconfig: ${{ steps.cfg.outputs.has_kubeconfig }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out lurus-proto-go
        uses: actions/checkout@v4
        with:
          repository: LurusTech/lurus-proto-go
          path: lurus-proto-go
          fetch-depth: 1

      - name: Check out zita-sdk-go (pinned, pre-alpha)
        uses: actions/checkout@v4
        with:
          repository: hanmahong5-arch/zita-sdk-go
          # Pre-alpha pin per release_cadence rule. Full sha required;
          # actions/checkout treats short shas as branch/tag names.
          ref: e2611da1e01ef77b8227571204d6780a6364fea3
          path: zita-sdk-go
          fetch-depth: 1

      - name: Determine version
        id: version
        run: |
          VERSION="staging-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing staging version: $VERSION"

      - name: Detect staging cluster credentials
        id: cfg
        env:
          KC: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          if [ -n "$KC" ]; then
            echo "has_kubeconfig=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_kubeconfig=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Staging deploy skipped::STAGING_KUBECONFIG secret is empty — the deploy job is skipped (not failed). Tracked infra dependency (doc/uat-handbook.md §2), not a code regression."
          fi

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:staging
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Deploy to staging environment
  deploy:
    name: Deploy to K3s Staging
    needs: build
    # HARD-DISABLED (if: false). The cluster API is Tailscale-only, so a
    # GitHub-hosted runner can never reach it — this job has never worked. Worse,
    # it applies deploy/k8s/staging/ (OIDC/Traefik overlay, ns lurus-staging),
    # which is NOT the live overlay: the serving deployment is deploy/k8s/r6-stage/
    # in ns lurus-newhub. Gating only on `has_kubeconfig` left a latent foot-gun —
    # the day someone set STAGING_KUBECONFIG it would silently deploy the wrong
    # overlay to the wrong namespace. The ONLY supported STAGE deploy path is SSH:
    # scripts/deploy-stage.sh (see doc/runbook/staging-deploy.md). The build job
    # above still emits the infra-gap ::warning::, so the gap stays documented.
    # Re-enable only after the staging/-vs-r6-stage overlay ADR is settled AND CI
    # can actually reach the cluster.
    if: false
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create namespace if not exists
        run: |
          kubectl get namespace lurus-staging || kubectl create namespace lurus-staging

      - name: Apply staging manifests
        run: |
          kubectl apply -k deploy/k8s/staging/

      - name: Rollout restart
        run: |
          kubectl -n lurus-staging rollout restart deployment/lurus-newhub

      - name: Wait for rollout
        run: |
          kubectl -n lurus-staging rollout status deployment/lurus-newhub --timeout=300s

      - name: Verify deployment
        run: |
          # Wait for pod to be ready
          kubectl -n lurus-staging wait --for=condition=ready pod -l app=lurus-newhub --timeout=120s

          # Get pod status
          kubectl -n lurus-staging get pods -l app=lurus-newhub

      - name: Health check
        run: |
          # Port-forward and check health
          kubectl -n lurus-staging port-forward svc/lurus-newhub 8850:8850 &
          PF_PID=$!
          sleep 5

          # Check health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8850/api/status || echo "000")

          kill $PF_PID 2>/dev/null || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP code: $HTTP_CODE"
            exit 1
          fi

          echo "Staging deployment successful! Health check passed."

      - name: Deployment summary
        if: always()
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ needs.build.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace:** lurus-staging" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://staging-api.lurus.cn" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl -n lurus-staging get pods -l app=lurus-newhub 2>/dev/null || echo "Unable to get pod status"
          echo '```' >> $GITHUB_STEP_SUMMARY
